<style id="app-style">
/* Layout: one-column phone app, RTL, dark "lantern night". Sticky glass header, content column, floating 6-tab bar. Deliberately single-theme (dark). */
:root{
  --bg:#0E1A1F; --bg2:#14242B; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.17);
  --ink:#EAF2EF; --muted:#9DB3AC; --soft:#B9CBC5; --lan:#FFC24B; --lan2:#FFD27A; --on-lan:#1A1405; --lan-soft:rgba(255,194,75,.14);
  --ok:#6FD3A8; --on-ok:#08241A; --warn:#FF9B6A; --danger:#FF6F61;
  --f:'Rubik','Segoe UI',system-ui,-apple-system,sans-serif; --f-vn:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
  --r:22px; color-scheme:dark;
}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(520px 320px at 85% -80px,rgba(255,194,75,.16),rgba(255,194,75,0) 70%) no-repeat,var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--lan2)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lan);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,26,31,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:16px;color:var(--lan);letter-spacing:.02em;white-space:nowrap}
.clocks{font-size:12.5px;color:var(--muted);text-align:left;line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
.clocks b{color:var(--ink);font-size:15px}
.editbtn{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer}
.editbtn[aria-pressed="true"]{background:var(--lan);color:var(--on-lan);border-color:var(--lan)}

/* day strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;max-width:640px;margin:0 auto}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:58px;padding:8px 0;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:center;font-size:12.5px;line-height:1.3;color:var(--muted);cursor:pointer;position:relative}
.chip b{display:block;font-size:17px;color:var(--ink)}
.chip[aria-current="true"]{background:var(--lan);border-color:var(--lan);color:var(--on-lan);box-shadow:0 0 22px rgba(255,194,75,.35)}
.chip[aria-current="true"] b{color:var(--on-lan)}
.chip.today::after{content:"";position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}

main{padding-block:14px calc(120px + env(safe-area-inset-bottom,0px))}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--muted)}
.wxchip{font-size:13.5px;font-weight:700;color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;white-space:nowrap;direction:ltr}
h1.title{margin:8px 0 0;font-size:30px;line-height:1.15;font-weight:700;text-wrap:balance}
.daysum{margin:8px 0 0;font-size:16.5px;line-height:1.55;color:var(--soft);max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.tag.yes{color:var(--lan2);border-color:rgba(255,194,75,.35)}
.banner{background:var(--lan-soft);border:1px solid rgba(255,194,75,.35);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:500;color:var(--lan2)}
.small{font-size:14px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:10px 4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:7px 13px;min-height:40px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn svg.i{width:16px;height:16px}
.btn.big{width:100%;height:52px;border-radius:16px;border:0;background:var(--lan);color:var(--on-lan);font-size:17px;box-shadow:0 0 26px rgba(255,194,75,.35)}
.btn.big svg.i{width:20px;height:20px}
.btn.lan{background:var(--lan);border-color:var(--lan);color:var(--on-lan)}
.btn.ok{background:rgba(111,211,168,.12);border-color:transparent;color:var(--ok);cursor:default}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{border-color:rgba(255,111,97,.45);color:#FFB3AA}
.btn[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* tasks */
.tasks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.task{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task.open{background:var(--glass2);border-color:rgba(255,194,75,.45);box-shadow:0 0 30px rgba(255,194,75,.08)}
.task.warn{border-color:rgba(255,155,106,.6)}
.task.done:not(.open) .task-head{opacity:.6}
.task-head{appearance:none;border:0;background:transparent;font:inherit;color:inherit;text-align:right;width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.ticon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--lan-soft);color:var(--lan)}
.ticon svg{width:22px;height:22px}
.k-move .ticon,.k-note .ticon{background:rgba(255,255,255,.08);color:var(--ink)}
.task.open .ticon{background:var(--lan);color:var(--on-lan)}
.tmain{min-width:0;display:flex;flex-direction:column;gap:1px}
.ttitle{font-weight:700;font-size:17px;line-height:1.3}
.tsum{color:var(--muted);font-size:14.5px;line-height:1.4}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ttime{font-weight:700;color:var(--lan);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap;font-size:15px}
.task.warn .ttime,.warntext{color:var(--warn)}
.prog{font-size:12.5px;font-weight:700;border:1px solid rgba(255,194,75,.5);color:var(--lan);border-radius:999px;padding:0 9px;font-variant-numeric:tabular-nums;direction:ltr}
.prog.full{background:rgba(111,211,168,.14);border-color:transparent;color:var(--ok)}
.chev{width:18px;height:18px;color:var(--muted)}
.task-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.task-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.lead{margin:0;color:var(--soft)}
.sub{display:block;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0}
.startpt{background:rgba(0,0,0,.22);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.startpt b{display:block;font-size:16px}
.fromto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fromto>div{background:rgba(0,0,0,.22);border-radius:16px;padding:10px 12px;min-width:0}
.fromto b{display:block;overflow-wrap:anywhere}
.reach{font-size:13.5px;color:var(--soft)}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.stop:not(:last-child)::before{content:"";position:absolute;right:14px;top:34px;bottom:4px;width:2px;background:rgba(255,255,255,.14)}
.stop:last-child{padding-bottom:0}
.snum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid rgba(255,255,255,.22);color:var(--muted);font-variant-numeric:tabular-nums}
.stop.next .snum{background:var(--lan);border-color:var(--lan);color:var(--on-lan);box-shadow:0 0 18px rgba(255,194,75,.55)}
.stop.arrived .snum{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.sbody{min-width:0;display:flex;flex-direction:column;gap:8px}
.sbody h5{margin:3px 0 0;font-size:16.5px;line-height:1.3}
.sbody p{margin:0;color:var(--muted);font-size:14.5px}
.stop.arrived h5{color:var(--muted)}
.about{background:rgba(0,0,0,.22);border-radius:14px;padding:12px;font-size:15px;color:var(--soft)}
.about img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px}

/* ticket */
.ticket{border:1.5px dashed var(--line2);border-radius:16px;background:rgba(0,0,0,.2);padding:14px}
.tk-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tk-port{display:flex;flex-direction:column;gap:1px;min-width:0}
.tk-port:last-child{align-items:flex-end;text-align:left}
.tk-code{font-size:28px;font-weight:700;line-height:1;direction:ltr}
.tk-time{font-weight:700;font-size:18px;color:var(--lan);font-variant-numeric:tabular-nums}
.tk-time small{font-weight:500;color:var(--muted)}
.tk-mid{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:12.5px;text-align:center}
.tk-mid svg{width:24px;height:24px;color:var(--lan);transform:scaleX(-1)}
.tk-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line2)}
.tk-meta .k{font-size:12px;color:var(--muted);font-weight:700}
.tk-meta .v{font-weight:700;unicode-bidi:plaintext;overflow-wrap:anywhere}

/* panels */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.panel p{margin:0}
.sectiontitle{font-size:30px;font-weight:700;margin:4px 0 4px;line-height:1.15}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:13px;color:var(--muted);font-weight:700}
.kv .v{font-size:17px;font-weight:700;unicode-bidi:plaintext;overflow-wrap:anywhere}
.kv .v.dim{color:var(--muted);font-weight:500;font-size:15px}
.wx-row{display:flex;gap:14px;align-items:center}
.temp{font-size:28px;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr;color:var(--lan)}
.wx-sub{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.map svg{width:100%;height:auto;display:block}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line2);background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
.edit-fields{display:grid;grid-template-columns:92px 1fr;gap:8px}
.edit-fields .full{grid-column:1/-1}
.edit-stop{display:grid;gap:6px;padding:8px;border:1px dashed var(--line2);border-radius:12px}
.task.edit{border-style:dashed}

/* stats + map tab */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--lan);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bigmap{margin:4px calc(-1 * max(16px,env(safe-area-inset-left,0px)));}
.bigmap svg{display:block;width:100%;height:auto}
.visited{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font-size:13.5px;border-radius:999px;padding:5px 11px;background:var(--lan-soft);color:var(--lan2)}
.vchip.dim{background:var(--glass);color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--soft)}

/* home */
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-size:44px;line-height:1;color:var(--lan);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--lan);border-radius:999px;box-shadow:0 0 14px rgba(255,194,75,.6)}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.homegrid .panel{margin-top:0}
.scard{position:relative;border-radius:var(--r);overflow:hidden;background:#FFF8EC;color:#2A2522;min-height:260px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.scard img{display:block;width:100%;max-height:380px;object-fit:cover}
.scard .note{padding:16px 18px 18px;font-size:19px;line-height:1.5;white-space:pre-wrap}
.scard .from{display:block;margin-top:8px;font-size:14px;color:#6B6058}
.scard canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s}
.locked{border-radius:var(--r);border:1px dashed rgba(255,194,75,.45);background:var(--lan-soft);padding:26px 18px;text-align:center}
.locked b{display:block;font-size:20px;margin-bottom:4px}
.pastcards{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pastcards button{flex:none;width:120px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:8px;text-align:right;cursor:pointer;color:var(--ink)}
.pastcards img{width:100%;height:80px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}

/* emergency */
.sos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sos a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border-radius:18px;background:rgba(255,111,97,.12);border:1px solid rgba(255,111,97,.4);text-decoration:none;color:var(--ink)}
.sos a b{font-size:28px;color:#FFB3AA;direction:ltr}
.sos a span{font-size:13.5px;color:var(--soft)}
.hosp{padding:12px 0;border-bottom:1px solid var(--line)}
.hosp:last-child{border-bottom:0}
.hosp b{display:block;font-size:16.5px}
.phrases{display:grid;grid-template-columns:1fr;gap:8px}
.phrases button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:12px 14px;text-align:right;cursor:pointer;color:var(--ink);font-size:16px;font-weight:500}
.phrases button span{font-family:var(--f-vn);font-size:13px;color:var(--muted);direction:ltr}

/* AI */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.answer{white-space:pre-wrap;background:var(--glass2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;font-size:17px}

/* floating nav */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;max-width:616px;margin:0 auto;background:rgba(20,36,42,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:7px 4px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav.tabs button{border:0;background:transparent;border-radius:16px;padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--lan);font-weight:700}
nav.tabs button.sos-tab:not([aria-current="true"]){color:#FFB3AA}

/* overlays + bars */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center;overflow:auto}
.overlay .vn{font-family:var(--f-vn);font-weight:700;font-size:clamp(30px,9vw,52px);line-height:1.2;direction:ltr;color:var(--ink)}
.overlay .req{font-family:var(--f-vn);font-size:20px;direction:ltr;color:var(--soft)}
.overlay img{max-width:100%;border-radius:12px;margin:0 auto}
.editbar{position:fixed;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;z-index:7;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.editbar .inner{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4);font-weight:500;max-width:600px}
.editbar .btn{background:var(--lan);color:var(--on-lan);border:0}
.status{font-size:14px;color:var(--muted);margin-top:8px}
.err{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.legs{list-style:none;padding:0;margin:0}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}.btn,.chip,nav.tabs button{transition:background .15s,color .15s}}
</style>

<script>
(function(){
  function bytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
  function locked(){
    document.getElementById('locked').hidden=false;
    document.getElementById('keyform').addEventListener('submit',function(e){
      e.preventDefault();
      var v=(document.getElementById('keyinput').value||'').trim(), k2=v.indexOf('#')>=0?v.split('#').pop():v;
      if(!k2) return;
      try{ localStorage.setItem('vt-key',k2); }catch(_){}
      location.replace(location.pathname+'#'+k2); location.reload();
    });
  }
  var fromLink=(location.hash||'').slice(1), k=fromLink;
  try{ if(k) localStorage.setItem('vt-key',k); else k=localStorage.getItem('vt-key')||''; }catch(e){}
  if(!k||!window.crypto||!crypto.subtle) return locked();
  var raw; try{ raw=bytes(k); }catch(e){ return locked(); }
  crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']).then(function(key){
    var b=bytes(document.getElementById('trip-sealed').textContent.trim());
    return Promise.all([crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)),crypto.subtle.digest('SHA-256',raw)]).then(function(r){
      var bundle=JSON.parse(new TextDecoder().decode(r[0]));
      window.__trip={key:key,tok:hex(r[1])};
      if(!fromLink){ try{ history.replaceState(null,'',location.pathname+'#'+k); }catch(e){} }
      var d=document.createElement('script'); d.type='application/json'; d.id='trip-data'; d.textContent=bundle.data; document.body.appendChild(d);
      var s=document.createElement('script'); s.id='app-script'; s.textContent=bundle.app; document.body.appendChild(s);
    });
  }).catch(locked);
})();
</script>
