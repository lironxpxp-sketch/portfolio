<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d6857">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הטיול">
<title>הטיול</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.locked{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font:18px/1.5 'Assistant',system-ui,sans-serif;color:var(--ink)}
.locked h1{font:400 26px/1.2 'Suez One',Georgia,serif;margin:0 0 8px}</style>
<style id="app-style">
/* Layout: one-column phone app, RTL. Sticky header + day strip, day timeline, fixed bottom tab bar. Ha Long jade + Hoi An lantern yellow on rice-paper neutral. */
:root{
  --bg:#f1f4ef; --surface:#ffffff; --sunk:#e6ece7; --ink:#14211c; --muted:#56675f; --line:#d3ddd6;
  --jade:#0d6857; --on-jade:#ffffff; --jade-soft:#d9ece6; --lantern:#c98a12; --lantern-soft:#fbeed0; --warn:#9c4410;
  --f-display:'Suez One','Frank Ruhl Libre',Georgia,serif;
  --f-body:'Assistant','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-vn:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1613; --surface:#16211d; --sunk:#1d2a25; --ink:#e6eee9; --muted:#9bb0a6; --line:#2a3933;
  --jade:#4cbfa5; --on-jade:#06231c; --jade-soft:#173a32; --lantern:#efbb4f; --lantern-soft:#3a2f14; --warn:#f0a06c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613; --surface:#16211d; --sunk:#1d2a25; --ink:#e6eee9; --muted:#9bb0a6; --line:#2a3933;
  --jade:#4cbfa5; --on-jade:#06231c; --jade-soft:#173a32; --lantern:#efbb4f; --lantern-soft:#3a2f14; --warn:#f0a06c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--jade)}
*{box-sizing:border-box}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--jade);color:var(--on-jade)}
header.top .wrap{padding-block:12px 10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.brand p{margin:2px 0 0;font-size:14px;opacity:.85}
.clocks{text-align:left;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;opacity:.95;white-space:nowrap}
.clocks b{font-size:16px}
.strip{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4}
.strip-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;max-width:680px;margin:0 auto}
.strip-scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;min-width:64px;text-align:center;cursor:pointer;line-height:1.2}
.chip .n{display:block;font-weight:800;font-size:15px}
.chip .d{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .c{display:block;font-size:12px}
.chip[aria-current="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.chip[aria-current="true"] .d{color:inherit;opacity:.85}
.chip.today{box-shadow:inset 0 -3px 0 var(--lantern)}
main{padding-block:16px 120px}
.dayhead h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:14px;padding:2px 10px;border-radius:999px;background:var(--sunk)}
.tag.yes{background:var(--jade-soft)}
.countdown{background:var(--lantern-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.panel h3{margin:0 0 6px;font-size:16px;color:var(--muted);font-weight:800;letter-spacing:.02em}
.weather{display:flex;gap:14px;align-items:center}
.temp{font-family:var(--f-display);font-size:30px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.weather p{margin:0}
.small{font-size:14px;color:var(--muted)}
.timeline{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.item.done{opacity:.6}
.time{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;color:var(--jade);direction:ltr;text-align:right}
.time.unk{color:var(--warn);font-size:14px}
.item .body{min-width:0}
.item h4{margin:0;font-size:18px;line-height:1.3}
.item p{margin:2px 0 0;color:var(--muted);font-size:16px}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;min-height:40px}
.btn.primary{background:var(--jade);color:var(--on-jade);border-color:var(--jade)}
.btn.lantern{background:var(--lantern-soft);border-color:transparent}
.btn.ghost{background:transparent}
.pin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--lantern);color:#1d1503;font-size:13px;font-weight:800;flex:none}
.map svg{width:100%;height:auto;display:block}
.map .note{margin:6px 0 10px}
.hotel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hotel strong{font-size:18px}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .row{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--jade);background:var(--jade-soft)}
.sectiontitle{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px;color:var(--muted);font-weight:700}
.kv .v{font-size:18px;font-weight:700;word-break:break-word;direction:ltr;text-align:right;unicode-bidi:plaintext}
.kv .v.he{direction:rtl}
.legs{list-style:none;padding:0;margin:0}
.legs li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.legs li:last-child{border-bottom:0}
.legs .dt{font-weight:800;color:var(--jade);font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:17px}
textarea{min-height:90px;resize:vertical}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.answer{white-space:pre-wrap;background:var(--jade-soft);border-radius:var(--r);padding:14px;margin-top:12px;font-size:17px}
.driver{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center}
.driver .vn{font-family:var(--f-vn);font-weight:700;font-size:clamp(30px,9vw,52px);line-height:1.2;direction:ltr;color:var(--ink)}
.driver .req{font-family:var(--f-vn);font-size:20px;direction:ltr;color:var(--muted)}
.editbar{position:fixed;inset:auto 0 calc(70px + env(safe-area-inset-bottom,0px)) 0;z-index:7;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.editbar .inner{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.editbar .btn{background:var(--lantern);color:#1d1503;border:0}
.edit-fields{grid-column:1/-1;display:grid;grid-template-columns:90px 1fr;gap:8px}
.edit-fields textarea,.edit-fields .full{grid-column:1/-1}
.toggle-edit{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;cursor:pointer}
.status{font-size:14px;color:var(--muted);margin-top:8px}
.item.warn{border-color:var(--warn);box-shadow:inset -4px 0 0 var(--warn)}
.item.warn .time{color:var(--warn)}
.wx-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.wx-head h3{margin:0}
.wx-head .btn{min-height:34px;padding:4px 12px;font-size:14px}
.wx-row{display:flex;gap:14px;align-items:center}
.wx-row p{margin:0}
.wx-sub{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pinbox{display:flex;gap:8px;margin-top:8px}
.pinbox input{flex:1;min-width:0}

.daysum{margin:10px 0 0;font-size:18px;line-height:1.55;max-width:60ch}
.tasks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task.open{border-color:var(--jade)}
.task.warn{border-color:var(--warn);box-shadow:inset -4px 0 0 var(--warn)}
.task.done:not(.open) .task-head{opacity:.62}
.task-head{appearance:none;border:0;background:transparent;font:inherit;color:inherit;text-align:right;width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;cursor:pointer}
.task-head:focus-visible{outline:3px solid var(--lantern);outline-offset:-3px}
.ticon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade)}
.ticon svg{width:22px;height:22px}
.k-flight .ticon,.k-stay .ticon{background:var(--lantern-soft);color:var(--ink)}
.tmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.ttitle{font-weight:800;font-size:18px;line-height:1.3}
.tsum{color:var(--muted);font-size:16px;line-height:1.4}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ttime{font-weight:800;color:var(--jade);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.task.warn .ttime,.warntext{color:var(--warn)}
.chev{width:20px;height:20px;color:var(--muted)}
.task-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.prog{font-size:13px;font-weight:800;background:var(--sunk);border-radius:999px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prog.full{background:var(--jade-soft);color:var(--jade)}
.task-body{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.lead{margin:0}
.sub{display:block;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin:0}
.startpt{background:var(--sunk);border-radius:12px;padding:10px 12px}
.startpt b{display:block;font-size:17px}
.fromto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fromto>div{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.fromto b{display:block;overflow-wrap:anywhere}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;position:relative;padding-bottom:18px}
.stop:not(:last-child)::before{content:"";position:absolute;right:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.stop:last-child{padding-bottom:0}
.snum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);color:var(--ink);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.stop.next .snum{background:var(--lantern);border-color:var(--lantern);color:#1d1503}
.stop.arrived .snum{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.sbody{min-width:0}
.sbody h5{margin:3px 0 0;font-size:17px;line-height:1.3}
.sbody p{margin:2px 0 0;color:var(--muted);font-size:15px}
.stop.arrived h5{color:var(--muted)}
.reach{font-size:14px;margin-top:6px;background:var(--bg);border-radius:8px;padding:6px 10px}
.actions.mini{margin-top:6px;gap:6px}
.actions.mini .btn{min-height:34px;padding:4px 10px;font-size:14px}
.btn.ok{background:var(--jade-soft);border-color:transparent;color:var(--jade);cursor:default}
.about{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-size:15px}
.about img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px}
.ticket{border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);padding:12px}
.tk-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tk-port{display:flex;flex-direction:column;gap:1px;min-width:0}
.tk-port:last-child{align-items:flex-end;text-align:left}
.tk-code{font-family:var(--f-display);font-size:30px;line-height:1;direction:ltr}
.tk-time{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.tk-time small{font-weight:600;color:var(--muted)}
.tk-mid{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:13px;text-align:center}
.tk-mid svg{width:26px;height:26px;transform:scaleX(-1)}
.tk-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line)}
.tk-meta .k{font-size:12px;color:var(--muted);font-weight:700}
.tk-meta .v{font-weight:800;unicode-bidi:plaintext;overflow-wrap:anywhere}
.task.edit{border-style:dashed}
.edit-stop{display:grid;gap:6px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.daylist{list-style:none;margin:0;padding:0}
.daylist li+li{border-top:1px solid var(--line)}
.daylist button{appearance:none;border:0;background:transparent;font:inherit;color:inherit;text-align:right;width:100%;display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:10px 0;cursor:pointer}
.dl-n{font-weight:800;color:var(--jade);line-height:1.2}
.dl-n small{display:block;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.dl-b{display:flex;flex-direction:column}
.dl-b span{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:no-preference){.chip,.btn,nav.tabs button{transition:background .15s,color .15s}.chev{transition:transform .2s}}
</style>
<script src="../../assets/claude-shim.js?v=9"></script>
</head>
<body>

<script>
(function(){
  function bytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
  function locked(){document.getElementById('locked').hidden=false;}
  var fromLink=(location.hash||'').slice(1), k=fromLink;
  try{ if(k) localStorage.setItem('vt-key',k); else k=localStorage.getItem('vt-key')||''; }catch(e){}
  if(!k||!window.crypto||!crypto.subtle) return locked();
  var raw; try{ raw=bytes(k); }catch(e){ return locked(); }
  crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']).then(function(key){
    var b=bytes(document.getElementById('trip-sealed').textContent.trim());
    return Promise.all([crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)),crypto.subtle.digest('SHA-256',raw)]).then(function(r){
      var bundle=JSON.parse(new TextDecoder().decode(r[0]));
      window.__trip={key:key,tok:hex(r[1])};
      if(!fromLink){ try{ history.replaceState(null,'',location.pathname+'#'+k); }catch(e){} }
      var d=document.createElement('script'); d.type='application/json'; d.id='trip-data'; d.textContent=bundle.data; document.body.appendChild(d);
      var s=document.createElement('script'); s.id='app-script'; s.textContent=bundle.app; document.body.appendChild(s);
    });
  }).catch(locked);
})();
