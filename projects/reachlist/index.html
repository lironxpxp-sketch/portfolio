<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reachlist Builder</title>
<meta name="description" content="Builds a prospect list in minutes: target companies, the right decision-makers, message drafts and more.">

<style>
:root{
  --bg:#0a0c10; --bg2:#0f1218; --card:#12161e; --card2:#161b25; --line:#1f2632; --line2:#2b3442;
  --fg:#e8ecf2; --muted:#8a94a6; --dim:#5c6678;
  --acc:#c6f432; --acc-ink:#0a0c10; --acc2:#5ee1ff; --warn:#ffc25e; --bad:#ff7a7a;
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
a{color:var(--acc2)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:420px){.badge .lg{display:none}.steps li{padding:5px 10px 5px 6px;font-size:12px}}
.brand .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.badge{font:500 11px var(--mono);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:3px 9px;border-radius:999px;white-space:nowrap}

/* stepper */
.steps{display:flex;gap:6px;margin:26px 0 22px;padding:0;flex-wrap:wrap}
.steps li{list-style:none;display:flex;align-items:center;gap:8px;font:500 12.5px var(--mono);color:var(--dim);padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:999px}
.steps li b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--bg2);border:1px solid var(--line2)}
.steps li.on{color:var(--fg);border-color:var(--line2);background:var(--card)}
.steps li.on b{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.steps li.done{color:var(--muted)}
.steps li.done b{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.steps ol{display:contents}

/* cards and controls */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.5vw,36px)}
.narrow{max-width:760px}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.12;letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.015em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px;max-width:62ch}
.lbl{display:block;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg);cursor:pointer;text-decoration:none;transition:border-color .15s,transform .15s,filter .15s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:10px;padding:10px 14px;margin:14px 0 0}

/* autocomplete */
.ac{position:relative}
.ac input{width:100%;font-size:18px;padding:15px 16px 15px 46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);outline:none;transition:border-color .15s}
.ac input:focus{border-color:var(--acc)}
.ac .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.ac ul{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;margin:0;padding:6px;list-style:none;background:var(--card2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px -10px rgba(0,0,0,.6);max-height:340px;overflow:auto}
.ac li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer}
.ac li[aria-selected="true"],.ac li:hover{background:var(--bg2)}
.ac li .fav{width:28px;height:28px;border-radius:7px;background:var(--bg) center/18px no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted)}
.ac li .t{min-width:0;display:grid}
.ac li .n{font-weight:600}
.ac li .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac li.use .n{color:var(--acc)}
.hint{font-size:13px;color:var(--dim);margin:10px 2px 0}

/* loading */
.load{display:flex;align-items:center;gap:14px;padding:26px 0 6px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--acc);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* product choice */
.company{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:22px}
.company .fav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/24px no-repeat;flex:none}
.company b{display:block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--bg2))}
.opt .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:3px}
.opt[aria-checked="true"] .rad{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--bg2);background:var(--acc)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:14px}

/* targets */
.sum{padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--acc2) 7%,var(--bg2));border:1px solid color-mix(in srgb,var(--acc2) 25%,transparent);margin:0 0 24px}
.sum b{color:var(--fg)}
.grp{margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:9px 13px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;max-width:100%}
.chip .c1{font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center}
.chip .c1::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);flex:none}
.chip .c2{font-size:12.5px;color:var(--dim);padding-left:21px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--bg2))}
.chip[aria-pressed="true"] .c1::before{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 2.5px var(--bg2)}
.chip.mk{flex-direction:row;padding:7px 12px}
.add{display:flex;gap:6px;margin-top:10px;max-width:420px}
.add input{flex:1;min-width:0;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:14px}
.add input:focus{border-color:var(--acc)}
.cta{margin-top:8px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* results */
.rhead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:0 0 16px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.stat{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.stat b{color:var(--fg);font-weight:500}
.stat.e b{color:var(--acc)}
.stat.l b{color:var(--acc2)}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--card2)}
tbody tr.sel{background:color-mix(in srgb,var(--acc) 5%,var(--card2))}
tbody tr.new{animation:fl 1.6s ease}
@keyframes fl{0%{background:color-mix(in srgb,var(--acc) 16%,var(--card))}100%{background:transparent}}
.num{font:500 12px var(--mono);color:var(--dim);width:34px}
.co b{display:block;font-size:14.5px}
.co .lk{display:flex;gap:10px;margin-top:3px;font:500 12px var(--mono)}
.co .lk a{color:var(--muted);text-decoration:none}
.co .lk a:hover{color:var(--acc2)}
.fit{display:inline-block;min-width:40px;text-align:center;font:600 13px var(--mono);padding:3px 8px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2)}
.fit.hi{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.fit.md{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.why{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:38ch}
.pc b{display:block;font-weight:600}
.pc span{color:var(--muted);font-size:13px}
.via{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:3px 9px;border-radius:999px;white-space:nowrap}
.via.email{color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.via.li{color:var(--acc2);background:color-mix(in srgb,var(--acc2) 9%,transparent);border:1px solid color-mix(in srgb,var(--acc2) 30%,transparent)}
.via.wait{color:var(--dim);border:1px dashed var(--line2)}
.skel td div{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bg2),var(--card2),var(--bg2));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.more{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.sampleban{font-size:13px;color:var(--warn);margin:0 0 12px}
.howto{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--acc) 6%,var(--bg2));border:1px solid color-mix(in srgb,var(--acc) 22%,transparent);font-size:14px;color:var(--muted)}
.howto b{color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
td.go{text-align:right;vertical-align:middle;width:1%;white-space:nowrap}
.btn.open{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);pointer-events:none}
tbody tr:hover .btn.open,tbody tr.sel .btn.open{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* side panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.side{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(470px,100%);background:var(--card);border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.7)}
.side .hd{padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.side .hd h2{font-size:21px}
.side .bd{padding:18px max(20px,env(safe-area-inset-right,0px)) 18px 22px;overflow:auto;flex:1;display:grid;gap:20px;align-content:start}
.side .ft{padding:14px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:2px 6px}
.sec h3{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
.sec p{margin:0}
.sec ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.contact{border:1px solid var(--line2);border-radius:12px;padding:13px 14px;background:var(--bg2)}
.contact .nm{font-weight:600}
.contact .tt{color:var(--muted);font-size:13.5px}
.contact .ln{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:9px;font:500 12.5px var(--mono)}
.contact .ln a{text-decoration:none}
.alt{font-size:13px;color:var(--muted);margin-top:8px}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font:500 11px var(--mono);color:var(--dim)}
.chain span{border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.chain span.ok{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:var(--bg2)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
textarea{width:100%;min-height:170px;resize:vertical;padding:12px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-size:14px;line-height:1.55;outline:none}
textarea:focus{border-color:var(--acc)}
.subj{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-size:14px;outline:none;margin-bottom:8px}
.cnt{font:500 11.5px var(--mono);color:var(--dim);text-align:right;margin-top:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55)}
.modal .box{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:28px;text-align:center}
.modal .em{font-size:34px;margin-bottom:6px}
.modal p{color:var(--muted);margin:8px 0 20px}
.modal .row{justify-content:center}

body.side-open .pf-back,body.modal-open .pf-back{display:none!important}
body.side-open{overflow:hidden}
.foot{color:var(--dim);font:13px var(--mono);padding:40px 0 calc(70px + env(safe-area-inset-bottom,0px))}

@media (max-width:820px){
  .tbl{border:0;background:none;overflow:visible}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tbody tr{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
  td{padding:0;border:0}
  td.num{display:none}
  td.co{grid-column:1}
  td.ft{grid-column:2;grid-row:1;justify-self:end}
  td.wn,td.pc,td.vv{grid-column:1/-1}
  td.go{grid-column:1/-1;text-align:left;width:auto;margin-top:4px}
  td.go .btn{width:100%}
  .why{max-width:none}
}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="ico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span>Reachlist Builder</div>
    <span class="badge">Test version<span class="lg"> · 20 leads</span></span>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="wrap foot">Leads are found live on the web by AI. Contact details come from public sources: check them before you reach out.</div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip=(s,n)=>{s=String(s||"").trim();return s.length>n?s.slice(0,n-1).trimEnd()+"…":s};
const ENDPOINT=window.__aiEndpoint||"";
const LEADS=20, RESERVE=5, MAX_SWAPS=10;
function track(p,t){try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:"reachlist/"+p,title:t||p,event:true})}catch(e){}}

/* ---------- URLs ---------- */
function httpUrl(u){u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(x.hostname)?x.toString():""}catch(e){return""}}
function domainOf(u){try{return new URL(httpUrl(u)).hostname.toLowerCase().replace(/^www\./,"")}catch(e){return""}}
const isCoLI=u=>/^https:\/\/([a-z]{2,3}\.)?linkedin\.com\/company\/[^\/?#\s]+/i.test(u||"");
const isInLI=u=>/^https:\/\/([a-z]{2,3}\.)?linkedin\.com\/in\/[^\/?#\s]+/i.test(u||"");
const liCoSearch=n=>"https://www.linkedin.com/search/results/companies/?keywords="+encodeURIComponent(n);
const liPeopleSearch=q=>"https://www.linkedin.com/search/results/people/?keywords="+encodeURIComponent(q);
const favicon=d=>d&&!/\.example$/.test(d)?`https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(d)}`:"";

/* ---------- state ---------- */
const KEY="rlb.v2";
let S={step:1,company:null,info:null,product:0,aud:[],roles:[],markets:[],leads:[],reserve:[],seen:[],swaps:0,sel:null,sample:false,tpl:{}};
try{const v=JSON.parse(sessionStorage.getItem(KEY)||"null");if(v&&v.step)S=Object.assign(S,v)}catch(e){}
(S.leads||[]).forEach(l=>{delete l._busy;delete l._new});Object.values(S.tpl||{}).forEach(t=>{delete t.loading});
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{if(S.step===4&&!S.sample&&S.leads.length)localStorage.setItem(LAST,JSON.stringify(S))}catch(e){}}
/* one live test per visitor per day */
const LAST="rlb.last", DAY=24*60*60*1000;
function lastTest(){try{const t=+localStorage.getItem("rlb.testAt")||0;return Date.now()-t<DAY?t:0}catch(e){return 0}}
function markTest(){try{localStorage.setItem("rlb.testAt",String(Date.now()))}catch(e){}}
function savedResults(){try{const v=JSON.parse(localStorage.getItem(LAST)||"null");return v&&v.leads&&v.leads.length?v:null}catch(e){return null}}
function nextTime(){const t=lastTest();if(!t)return"";const d=new Date(t+DAY);return d.toLocaleString([], {weekday:"long",hour:"2-digit",minute:"2-digit"})}
let busy="", error="", sample=null, CAPS={};

async function post(body){
  const r=await fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:d.code||"upstream_error",message:d.message||("HTTP "+r.status)};
  return d;
}
function friendly(e){
  const c=e&&e.code;
  if(c==="rate_limited")return "Lots of people are trying this right now. Wait a minute and try again.";
  if(c==="not_configured")return "The AI isn't connected at the moment. Try the sample run instead.";
  if(c==="invalid_json")return "The AI's answer came back garbled. Please try again.";
  return "Something went wrong reaching the AI. Please try again.";
}

let acItems=[], acIdx=-1, acTimer=0, acSeq=0;
function bCompany(){
  const q=$("#q"); if(!q)return;
  acItems=[];acIdx=-1;
  const list=$("#acl");
  $("#demo").onclick=e=>{e.preventDefault();loadSample()};
  const mine=$("#mine");if(mine)mine.onclick=e=>{e.preventDefault();const v=savedResults();if(v){S=Object.assign(S,v,{sel:null});save();render()}};
  setTimeout(()=>q.focus(),30);
  const close=()=>{list.hidden=true;q.setAttribute("aria-expanded","false");q.removeAttribute("aria-activedescendant")};
  const draw=()=>{
    if(!acItems.length){close();return}
    list.innerHTML=acItems.map((it,i)=>`<li id="ac${i}" role="option" aria-selected="${i===acIdx}" class="${it.use?"use":""}" data-i="${i}">
      <span class="fav" style="${it.domain&&favicon(it.domain)?`background-image:url('${favicon(it.domain)}')`:""}">${it.domain?"":"+"}</span>

    list.hidden=false;q.setAttribute("aria-expanded","true");
    if(acIdx>=0)q.setAttribute("aria-activedescendant","ac"+acIdx);else q.removeAttribute("aria-activedescendant");
  };
  const base=v=>{
    const out=[];const t=v.trim();if(!t)return out;
    const looksUrl=/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(t)&&!/\s/.test(t);
    if(looksUrl){const d=domainOf(t);if(d)out.push({label:"Use website "+d,sub:"Read this site directly",name:d.split(".")[0].replace(/^./,c=>c.toUpperCase()),website:httpUrl(t),domain:d,use:true})}
    else out.push({label:`Use “${clip(t,40)}”`,sub:"Find the website automatically",name:t,website:"",domain:"",use:true});
    return out;
  };
  q.addEventListener("input",()=>{
    const v=q.value;acIdx=-1;acItems=base(v);draw();
    clearTimeout(acTimer);
    if(v.trim().length<2||!ENDPOINT)return;
    const seq=++acSeq;
    acTimer=setTimeout(async()=>{
      try{
        const d=await post({companySuggest:v.trim()});

/* ---------- AI: read the company ---------- */
async function analyze(){
  await ready;
  const c=S.company;
  if(!LIVE()){error="The live AI isn't available here. Try the sample run.";busy="";render();return}
  busy=c.website?`Reading ${c.domain||c.website} to see what ${c.name} sells…`:`Looking up ${c.name} and its website…`;render();
  const prompt=`You are a B2B go-to-market analyst. Work out what this company sells and who buys it.
Company: ${c.name}
Website: ${c.website||"unknown: find the company's official website first"}

Reply with only JSON, in this shape:
{"company":"official company name","website":"https://official-site","summary":"one plain sentence: what they do and for whom","products":[{"name":"product or product line","oneLiner":"what it does, max 14 words","audiences":[{"name":"type of company that buys it, e.g. Mid-size e-commerce brands","why":"max 12 words"}],"roles":[{"title":"job title of the buyer or champion, e.g. VP Marketing","why":"max 12 words"}]}],"markets":["main regions they sell in, e.g. United States, Europe, Israel, Worldwide"]}

Rules:
- List each real product or product line separately, most important first, at most 5. If they sell one thing, return one.
- For each product give 4 to 6 audiences and 4 to 6 roles, most likely buyers first. Audiences are types of companies (industry, size, stage), not individuals.
- Base this on the company's own website. Don't invent products.`;
  try{
    const r=await sample.json(prompt,{task:c.website?"site":"research",siteUrl:c.website||"",deep:true,webSearch:!c.website,cache:false});
    const products=(Array.isArray(r&&r.products)?r.products:[]).slice(0,5).map(p=>({
      name:clip(p&&p.name,60),oneLiner:clip(p&&p.oneLiner,140),
      audiences:(Array.isArray(p&&p.audiences)?p.audiences:[]).map(a=>({name:clip(a&&(a.name||a),70),why:clip(a&&a.why,90)})).filter(a=>a.name).slice(0,6),
      roles:(Array.isArray(p&&p.roles)?p.roles:[]).map(a=>({name:clip(a&&(a.title||a.name||a),60),why:clip(a&&a.why,90)})).filter(a=>a.name).slice(0,6)
    })).filter(p=>p.name);
    if(!products.length)throw {code:"empty"};
    const site=httpUrl(r.website)||c.website;
    S.company={name:clip(r.company,60)||c.name,website:site,domain:domainOf(site)};
    S.info={summary:clip(r.summary,200),products,markets:(Array.isArray(r.markets)?r.markets:[]).map(m=>clip(m,30)).filter(Boolean).slice(0,4)};
    S.product=0;S.step=2;busy="";error="";save();render();
    track("analyzed","Company analysed");
  }catch(e){
    busy="";error=e&&e.code==="empty"?`I couldn't work out what ${c.name} sells. Try picking it again, or type its website address.`:friendly(e);render();
  }
}

/* ---------- AI: find leads ---------- */
function leadPrompt(n,focus,exclude){
  const p=S.info.products[S.product];
  return `Find ${n} real companies that are strong prospects to buy this product. Use web search to check that each company is real and currently operating.

Seller: ${S.company.name} (${S.company.website})
Product: ${p.name}: ${p.oneLiner}
Target company types: ${S.aud.join("; ")}
Decision-maker roles: ${S.roles.join("; ")}
Region: ${S.markets.join(", ")||"Worldwide"}
${focus?`Focus this batch on: ${focus}\n`:""}Do not include: ${S.company.name}, its direct competitors${exclude.length?", or any of these: "+exclude.join(", "):""}.

For each company give:
- its official website and its LinkedIn company page URL (linkedin.com/company/...) if you found it, else ""
- "why_now": one sentence on a recent, real trigger from the last 12 months that makes this a good moment to reach out (funding, hiring for the target roles, a launch, expansion, new leadership), with the source page in "why_now_url". If you found none, give the strongest fit reason and leave the URL "".
- "fit": 1 to 100, and 2 short reasons
- "people": up to 2 people in the decision-maker roles whom you actually found on the web, with their exact title and their own LinkedIn profile URL (linkedin.com/in/...) only if you found it. Never invent people; use [] if you found none.

Reply with only JSON: {"leads":[{"company":"","website":"https://","linkedin":"","segment":"which target company type it matches","fit":80,"reasons":["",""],"why_now":"","why_now_url":"","people":[{"name":"","title":"","linkedin":""}]}]}`;
}
let uid=Date.now()%100000;
function cleanLeads(r){
  const arr=Array.isArray(r&&r.leads)?r.leads:Array.isArray(r)?r:[];
  return arr.map(l=>{
    const website=httpUrl(l&&l.website), domain=domainOf(website), company=clip(l&&l.company,70);
    if(!company||!domain)return null;
    return {id:"L"+(uid++),company,website,domain,linkedin:isCoLI(l.linkedin)?l.linkedin:"",segment:clip(l.segment,70),
      fit:Math.max(1,Math.min(100,Math.round(+l.fit)||60)),reasons:(Array.isArray(l.reasons)?l.reasons:[]).map(x=>clip(x,120)).filter(Boolean).slice(0,3),
      whyNow:clip(l.why_now,220),whyNowUrl:httpUrl(l.why_now_url),
      people:(Array.isArray(l.people)?l.people:[]).map(p=>({name:clip(p&&p.name,60),title:clip(p&&p.title,90),linkedin:isInLI(p&&p.linkedin)?p.linkedin:""})).filter(p=>p.name&&p.name.split(/\s+/).length>=2).slice(0,2),
      contact:null};
  }).filter(Boolean);
}
function addUnique(list,into){
  const have=new Set([...S.seen,domainOf(S.company.website)]);
  for(const l of list){if(have.has(l.domain))continue;have.add(l.domain);S.seen.push(l.domain);into.push(l)}
}
async function fetchLeads(n,focus){
  const exclude=S.seen.slice(-60).concat(S.leads.map(l=>l.company)).slice(0,80);
  return cleanLeads(await sample.json(leadPrompt(n,focus,exclude),{task:"research",webSearch:true,cache:false}));
}
async function startLeads(){
  await ready;
  if(!LIVE()){error="The live AI isn't available here. Try the sample run from step 1.";render();return}
  if(lastTest()){track("daily-limit","Hit the daily test limit");modal("day");return}
  markTest();
  S.leads=[];S.reserve=[];S.seen=[];S.swaps=0;S.emailLookups=0;S.sel=null;S.tpl={};S.step=4;error="";busy=`Searching the web for companies that fit…`;save();render();
  track("start","Started a 20-lead test");
  const per=7, ANG=["recently funded or fast-growing companies","companies hiring for the decision-maker roles right now","well-known leaders in their segment","companies with a recent launch, expansion or new leadership"];
  const focus=ANG.map((a,i)=>(S.aud.length?S.aud[i%S.aud.length]+": ":"")+a);
  const got=[];let done=0;
  const run=async f=>{try{const l=await fetchLeads(per,f);addUnique(l,got);place(got)}catch(e){return e}finally{done++}};
  const errs=(await Promise.all(focus.map(run))).filter(Boolean);
  if(got.length<LEADS&&got.length){try{addUnique(await fetchLeads(LEADS-got.length+3,""),got);place(got)}catch(e){errs.push(e)}}
  busy="";
  if(!got.length){try{localStorage.removeItem("rlb.testAt")}catch(e){}error=friendly(errs[0]);S.step=3;save();render();return}
  place(got);save();render();resolveAll();
  track("leads","Got leads");
}
function place(got){
  // keep leads already on screen in place (and their contacts); add new ones, best fit first
  const shown=new Set(S.leads.map(l=>l.id));
  const fresh=got.filter(l=>!shown.has(l.id)&&!S.reserve.some(r=>r.id===l.id)).sort((x,y)=>y.fit-x.fit);
  const pool=[...S.reserve,...fresh].sort((x,y)=>y.fit-x.fit);
  while(S.leads.length<LEADS&&pool.length)S.leads.push(pool.shift());
  S.leads.sort((x,y)=>y.fit-x.fit);
  S.reserve=pool;
  busy=S.leads.length<LEADS?`Found ${S.leads.length} so far, still searching…`:"";
  save();if(S.step===4){render();resolveAll()}
}

/* ---------- contact waterfall ---------- */
const STOP=new Set(["of","and","the","for","to","in","at","&"]);
function roleScore(title){
  const t=String(title||"").toLowerCase();if(!t)return 0;
  let best=0;
  for(const r of S.roles){const w=r.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>1&&!STOP.has(x));if(!w.length)continue;best=Math.max(best,w.filter(x=>t.includes(x)).length/w.length)}
  const sen=/\b(chief|ceo|cmo|cro|coo|cto|cfo|founder|co-founder|owner|president)\b/.test(t)?.5:/\b(vp|vice president|head)\b/.test(t)?.4:/\bdirector\b/.test(t)?.3:/\b(manager|lead)\b/.test(t)?.15:0;
  return best+sen;
}
// Default contact: the decision-maker found on the web, reached via LinkedIn (no email credits used)
async function resolve(l){
  const chain=[{k:"Email finder",ok:false,off:true}];
  const withLi=l.people.find(p=>p.linkedin);
  if(withLi){chain.push({k:"LinkedIn profile",ok:true});return {kind:"li",name:withLi.name,title:withLi.title,linkedin:withLi.linkedin,chain}}
  if(l.people[0]){chain.push({k:"LinkedIn search",ok:true});const p=l.people[0];return {kind:"li",name:p.name,title:p.title,linkedin:liPeopleSearch(p.name+" "+l.company),search:true,chain}}
  chain.push({k:"LinkedIn role search",ok:true});
  const role=S.roles[0]||"Head of Marketing";
  return {kind:"li",name:"",title:role,linkedin:liPeopleSearch(role+" "+l.company),search:true,role:true,chain};
}
// Email lookup only when the visitor asks for it (uses one email-finder credit)
const MAX_EMAIL=5;
async function findEmail(l){
  if((S.emailLookups||0)>=MAX_EMAIL){modal("email");return}
  S.emailLookups=(S.emailLookups||0)+1;l._finding=true;save();renderSide();
  track("find-email","Looked up an email");
  let r=null;
  try{
    if(S.sample){await new Promise(x=>setTimeout(x,700));const c=l.contact||{};r={people:c.name?[{name:c.name,title:c.title,email:c.name.split(" ")[0].toLowerCase()+"@"+l.domain,verified:true,confidence:90}]:[],generic:["hello@"+l.domain]}}
    else r=await post({findPeople:{domain:l.domain}});
  }catch(e){r=null}
  delete l._finding;l.emailTried=true;
  const ppl=(r&&r.people)||[], generic=((r&&r.generic)||[])[0]||"", prev=l.contact||{};
  if(ppl.length){
    // favour a person who has an email over a more senior person who doesn't
    const best=ppl.map(p=>({p,s:roleScore(p.title)+(p.verified?.1:0)+(p.confidence||0)/1000})).sort((a,b)=>b.s-a.s)[0].p;
    const sameAsPrev=prev.name&&prev.name.toLowerCase()===best.name.toLowerCase();
    l.contact={kind:"email",name:best.name,title:best.title,email:best.email,linkedin:best.linkedin||(sameAsPrev&&!prev.search?prev.linkedin:""),verified:best.verified,confidence:best.confidence,generic,
      alt:!sameAsPrev&&prev.name?{name:prev.name,title:prev.title,linkedin:prev.search?"":prev.linkedin}:null,
      chain:[{k:"Email finder",ok:true}]};
    if((S.tpl[l.id]||{}).kind!=="email")S.tpl[l.id]={kind:"email"};
  }else{
    l.contact=Object.assign({},prev,{generic,noEmail:r?true:false,lookupFailed:!r,chain:[{k:"Email finder",ok:false},...(prev.chain||[]).filter(c=>c.k!=="Email finder")]});
  }
  save();updRow(l);stats();if(S.sel===l.id)renderSide();
}
let resolving=false;
async function resolveAll(){
  if(resolving)return;resolving=true;
  try{
    const queue=()=>S.leads.filter(l=>!l.contact&&!l._busy);
    const worker=async()=>{let l;while((l=queue()[0])){l._busy=true;try{l.contact=await resolve(l)}catch(e){l.contact={kind:"li",title:S.roles[0]||"",linkedin:liPeopleSearch((S.roles[0]||"")+" "+l.company),search:true,role:true,chain:[]}}delete l._busy;save();if(S.step===4){updRow(l);stats();if(S.sel===l.id)renderSide()}}};
    await Promise.all([worker(),worker(),worker()]);
  }finally{resolving=false}
}

/* ---------- step 4: leads ---------- */
function viaCell(c){
  if(!c)return `<span class="via wait">checking…</span>`;
  return c.kind==="email"?`<span class="via email">✉ Email</span>`:`<span class="via li">in LinkedIn</span>`;
}
function contactCell(c){
  if(!c)return `<span class="dim">…</span>`;
  if(c.role)return `<b>${esc(c.title)}</b><span>Search on LinkedIn</span>`;
  return `<b>${esc(c.name)}</b><span>${esc(c.title)}</span>`;
}
function rowHTML(l,i){
  const f=l.fit>=80?"hi":l.fit>=60?"md":"";
  return `<tr data-id="${l.id}" class="${S.sel===l.id?"sel":""}${l._new?" new":""}" tabindex="0" aria-label="${esc(l.company)}, open details">
    <td class="num">${i+1}</td>
    <td class="co"><b>${esc(l.company)}</b><span class="lk">${S.sample?`<span class="dim">${esc(l.domain)}</span>`:`<a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(l.domain)} ↗</a><a href="${esc(l.linkedin||liCoSearch(l.company))}" target="_blank" rel="noopener" title="${l.linkedin?"LinkedIn page":"Search on LinkedIn"}">LinkedIn ↗</a>`}</span></td>
    <td class="ft"><span class="fit ${f}" title="Fit score">${l.fit}</span></td>
    <td class="wn"><span class="why">${esc(l.whyNow||l.reasons[0]||"")}</span></td>
    <td class="pc">${contactCell(l.contact)}</td>
    <td class="vv">${viaCell(l.contact)}</td>
    <td class="go"><button class="btn sm open" tabindex="-1" aria-hidden="true">Contact info →</button></td></tr>`;
}
function vLeads(){
  const p=S.info&&S.info.products[S.product];
  const skel=busy&&S.leads.length<LEADS?Array.from({length:Math.min(6,LEADS-S.leads.length)},()=>`<tr class="skel"><td class="num"></td><td class="co"><div style="width:70%"></div></td><td class="ft"><div style="width:34px"></div></td><td class="wn"><div></div></td><td class="pc"><div style="width:60%"></div></td><td class="vv"><div style="width:60px"></div></td><td class="go"></td></tr>`).join(""):"";
  return `<section>
    ${S.sample?`<p class="sampleban">Sample run with made-up companies and people, to show how it works.</p>`:""}
    <div class="rhead"><div><h1 style="margin:0">${S.leads.length?`${S.leads.length} leads`:"Finding leads"} for ${esc(p?p.name:"")}</h1>
      <div class="stats" id="stats"></div></div>
      <div class="row"><button class="btn sm ghost" id="restart">Start over</button><button class="btn sm" id="csv"${S.leads.length?"":" disabled"}>⤓ Download CSV</button></div></div>
    ${busy?`<div class="load" style="padding-top:0"><span class="spin"></span><span>${esc(busy)} This usually takes 1–2 minutes.</span></div>`:""}
    ${S.leads.length?`<p class="howto"><span class="ic" aria-hidden="true">👆</span><span><b>Click any lead</b> to open its details: why it fits, the decision-maker and how to reach them, an email or LinkedIn message draft, and the <b>Find email</b> button.</span></p>`:""}
    <div class="tbl"><table><thead><tr><th>#</th><th>Company</th><th>Fit</th><th>Why now</th><th>Best contact</th><th>Reach via</th><th><span class="sr">Details</span></th></tr></thead>
    <tbody id="rows">${S.leads.map(rowHTML).join("")}${skel}</tbody></table></div>
    ${!busy&&S.leads.length?`<div class="more"><span class="dim mono" style="font-size:12.5px">${S.leads.length} leads · ${S.emailLookups||0} of ${MAX_EMAIL} email lookups used</span><button class="btn pri" id="more">Generate ${LEADS} more leads</button></div>`:""}
    ${error?`<p class="err">${esc(error)}</p>`:""}
  </section>`;
}
function stats(){
  const el=$("#stats");if(!el)return;
  const e=S.leads.filter(l=>l.contact&&l.contact.kind==="email").length, li=S.leads.filter(l=>l.contact&&l.contact.kind==="li").length, w=S.leads.length-e-li;
  el.innerHTML=`<span class="stat">for <b>${esc(S.company.name)}</b></span><span class="stat e"><b>${e}</b> with email</span><span class="stat l"><b>${li}</b> via LinkedIn</span>${w?`<span class="stat"><b>${w}</b> checking</span>`:""}`;
}
function updRow(l){const tr=$(`tr[data-id="${l.id}"]`);if(!tr)return;const i=S.leads.indexOf(l);tr.outerHTML=rowHTML(l,i);bindRows()}
function bindRows(){$$("#rows tr[data-id]").forEach(tr=>{tr.onclick=()=>openLead(tr.dataset.id);tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLead(tr.dataset.id)}}})}
function bLeads(){
  stats();bindRows();
  $("#restart").onclick=()=>{if(busy)return;S={step:1,company:null,info:null,product:0,aud:[],roles:[],markets:[],leads:[],reserve:[],seen:[],swaps:0,sel:null,sample:false,tpl:{}};error="";save();render()};
  $("#csv").onclick=downloadCSV;
  const m=$("#more");if(m)m.onclick=()=>{track("more-blocked","Asked for 20 more leads");modal()};
  if(S.leads.some(l=>!l.contact)&&!busy)resolveAll();
}

/* ---------- side panel ---------- */
function openLead(id){S.sel=id;save();$$("#rows tr").forEach(t=>t.classList.toggle("sel",t.dataset.id===id));renderSide();track("open-lead","Opened a lead")}
function closeSide(){const id=S.sel;S.sel=null;save();renderSide();const tr=$(`tr[data-id="${id}"]`);if(tr){tr.classList.remove("sel");tr.focus()}}
let sideEl=null;
function renderSide(){
  if(sideEl){sideEl.remove();sideEl=null}
  document.body.classList.toggle("side-open",!!(S.step===4&&S.leads.find(x=>x.id===S.sel)));
  const l=S.step===4&&S.leads.find(x=>x.id===S.sel);if(!l)return;
  const c=l.contact, t=S.tpl[l.id]||{kind:c&&c.kind==="email"?"email":"li"};
  sideEl=document.createElement("div");
  sideEl.innerHTML=`<div class="scrim"></div><aside class="side" role="dialog" aria-modal="true" aria-label="${esc(l.company)}">
    <div class="hd"><div><h2>${esc(l.company)}</h2><div class="co"><span class="lk">${S.sample?`<span class="dim">${esc(l.domain)}</span>`:`<a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(l.domain)} ↗</a><a href="${esc(l.linkedin||liCoSearch(l.company))}" target="_blank" rel="noopener">${l.linkedin?"LinkedIn page":"Find on LinkedIn"} ↗</a>`}</span></div></div><button class="x" aria-label="Close">×</button></div>
    <div class="bd">
      <div class="sec"><h3>Fit · ${l.fit}/100${l.segment?` · ${esc(l.segment)}`:""}</h3>${l.reasons.length?`<ul>${l.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}</div>
      ${l.whyNow?`<div class="sec"><h3>Why now</h3><p>${esc(l.whyNow)}${l.whyNowUrl&&!S.sample?` <a href="${esc(l.whyNowUrl)}" target="_blank" rel="noopener">Source ↗</a>`:""}</p></div>`:""}
      <div class="sec"><h3>Best contact</h3>${contactBlock(l)}</div>
      <div class="sec"><h3>Message draft</h3>
        <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Message type"><button data-k="email" aria-pressed="${t.kind==="email"}">Email</button><button data-k="li" aria-pressed="${t.kind==="li"}">LinkedIn</button></div>
        <button class="btn sm pri" id="gen"${!c?" disabled":""}>${t.body?"Rewrite":"Generate"}</button></div>
        <div id="tplout" style="margin-top:12px">${tplBlock(l,t)}</div></div>
    </div>
    <div class="ft"><button class="btn warn" id="client">Already a client</button><button class="btn ghost" id="close2">Close</button></div>
  </aside>`;
  document.body.appendChild(sideEl);
  const close=()=>closeSide();
  $(".scrim",sideEl).onclick=close;$(".x",sideEl).onclick=close;$("#close2",sideEl).onclick=close;
  sideEl.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  $$(".seg button",sideEl).forEach(b=>b.onclick=()=>{const cur=S.tpl[l.id]||{};S.tpl[l.id]={kind:b.dataset.k};if(cur.kind===b.dataset.k)S.tpl[l.id]=cur;save();renderSide()});
  $("#gen",sideEl).onclick=()=>genTemplate(l);
  const fm=$("#findmail",sideEl);if(fm)fm.onclick=()=>findEmail(l);
  $("#client",sideEl).onclick=()=>alreadyClient(l);
  bindTpl(l);
  setTimeout(()=>{const x=$(".x",sideEl);x&&x.focus()},20);
}
function contactBlock(l){
  const c=l.contact;
  if(!c)return `<div class="contact"><div class="load" style="padding:0"><span class="spin"></span><span>Looking for the best person to contact…</span></div></div>`;
  const links=[];
  if(c.email)links.push(`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`);
  if(c.linkedin&&!S.sample)links.push(`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">${c.search?"Search on LinkedIn":"LinkedIn profile"} ↗</a>`);
  else if(c.linkedin)links.push(`<span class="dim">LinkedIn profile</span>`);
  const head=c.role?`<div class="nm">${esc(c.title)} at ${esc(l.company)}</div><div class="tt">No named person found, so this searches LinkedIn for the role.</div>`:`<div class="nm">${esc(c.name)}</div><div class="tt">${esc(c.title)}</div>`;
  const note=c.kind==="email"?(c.verified?"Verified work email":"Work email, "+(c.confidence?c.confidence+"% confidence":"unverified")):(c.search?"Found on the web; open the search to find their profile":"Found on the web, check before you reach out");
  return `<div class="contact">${head}<div class="ln">${links.join("")}</div><div class="alt">${esc(note)}</div>
    ${c.alt?`<div class="alt">Also at ${esc(l.company)}: <b>${esc(c.alt.name)}</b>, ${esc(c.alt.title)}${c.alt.linkedin&&!S.sample?` · <a href="${esc(c.alt.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}</div>`:""}
    ${c.generic?`<div class="alt">General inbox: <a href="mailto:${esc(c.generic)}">${esc(c.generic)}</a></div>`:""}
    ${c.kind!=="email"?(l._finding?`<div class="load" style="padding:10px 0 0"><span class="spin"></span><span>Looking for a work email at ${esc(l.domain)}…</span></div>`
      :l.emailTried?`<div class="alt">${c.lookupFailed?"The email lookup didn't answer. Try again later.":`No public work email found at ${esc(l.domain)}.`}</div>`
      :(CAPS.emailFinder||S.sample)?`<div class="row" style="margin-top:10px"><button class="btn sm pri" id="findmail">✉ Find email</button><span class="dim" style="font-size:12.5px">${MAX_EMAIL-(S.emailLookups||0)} of ${MAX_EMAIL} lookups left in this test</span></div>`:""):""}
    ${c.chain&&c.chain.length?`<div class="chain" aria-label="How this contact was found">${c.chain.map(s=>`<span class="${s.ok?"ok":""}">${s.ok?"✓":"–"} ${esc(s.k)}${s.off?" (off)":""}</span>`).join("")}</div>`:""}</div>`;
}
function tplBlock(l,t){
  if(t.loading)return `<div class="load" style="padding:4px 0"><span class="spin"></span><span>Writing a ${t.kind==="email"?"short email":"LinkedIn note"}…</span></div>`;
  if(t.error)return `<p class="err" style="margin:0">${esc(t.error)}</p>`;
  if(!t.body)return `<p class="dim" style="margin:0;font-size:14px">${t.kind==="email"?"A short, personal cold email based on why they fit.":"A LinkedIn connection note, under 300 characters."}</p>`;
  const c=l.contact||{};
  const open=t.kind==="email"?(c.email?`<a class="btn sm" id="open" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(t.subject||"")}&body=${encodeURIComponent(t.body)}">Open in email ↗</a>`:""):(c.linkedin&&!S.sample?`<a class="btn sm" href="${esc(c.linkedin)}" target="_blank" rel="noopener">Open LinkedIn ↗</a>`:"");
  return `${t.kind==="email"?`<input class="subj" id="tsub" value="${esc(t.subject||"")}" aria-label="Subject">`:""}
    <textarea id="tbody" aria-label="Message">${esc(t.body)}</textarea>
    ${t.kind==="li"?`<div class="cnt" id="tcnt">${t.body.length}/300</div>`:""}
    <div class="row" style="margin-top:10px"><button class="btn sm" id="copy">Copy</button>${open}</div>`;
}
function bindTpl(l){
  const t=S.tpl[l.id];if(!t||!t.body||!sideEl)return;
  const b=$("#tbody",sideEl),s=$("#tsub",sideEl),cnt=$("#tcnt",sideEl);
  b.oninput=()=>{t.body=b.value;if(cnt)cnt.textContent=b.value.length+"/300";save()};
  if(s)s.oninput=()=>{t.subject=s.value;save()};
  $("#copy",sideEl).onclick=async e=>{const txt=(t.subject?`Subject: ${t.subject}\n\n`:"")+t.body;const btn=e.currentTarget;try{await navigator.clipboard.writeText(txt);btn.textContent="Copied ✓"}catch(err){b.select();btn.textContent="Press Ctrl+C"}setTimeout(()=>{btn.textContent="Copy"},1800);track("copy","Copied a message")};
}
async function genTemplate(l){
  const c=l.contact||{}, p=S.info.products[S.product], kind=(S.tpl[l.id]||{}).kind||"email";
  S.tpl[l.id]={kind,loading:true};renderSide();
  const first=c.name?c.name.split(/\s+/)[0]:"";
  if(S.sample){await new Promise(r=>setTimeout(r,700));S.tpl[l.id]=sampleTpl(l,kind,first);save();renderSide();return}
  const who=c.role?`the ${c.title}`:`${c.name}, ${c.title}`;
  const prompt=kind==="email"
    ?`Write a short cold email from someone at ${S.company.name} to ${who} at ${l.company}.
What we sell: ${p.name}: ${p.oneLiner}
Why ${l.company} fits: ${l.reasons.join("; ")}
Why now: ${l.whyNow||"none found"}
Rules: max 110 words. Plain and specific, no hype or buzzwords. Open with something about ${l.company} (use the "why now" if there is one), connect it to one concrete benefit, end with one easy ask (a 15-minute call). ${first?`Start with "Hi ${first},"`:'Start with "Hi there,"'} and sign off with "[Your name]".
Reply with only JSON: {"subject":"max 7 words, no clickbait","body":"the email"}`
    :`Write a LinkedIn connection note from someone at ${S.company.name} to ${who} at ${l.company}.
What we sell: ${p.name}: ${p.oneLiner}
Why now: ${l.whyNow||l.reasons[0]||""}
Rules: under 280 characters including spaces. Friendly, specific, no pitch-speak, no links. ${first?`Start with "Hi ${first},"`:'Start with "Hi,"'} Mention something real about ${l.company}, and say why you'd like to connect.
Reply with only JSON: {"body":"the note"}`;
  try{
    const r=await sample.json(prompt,{task:"copy",cache:false});
    let body=String(r&&r.body||"").trim();if(!body)throw {code:"invalid_json"};
    if(kind==="li"&&body.length>300)body=body.slice(0,297).trimEnd()+"…";
    S.tpl[l.id]={kind,subject:kind==="email"?clip(r.subject,80):"",body};track("template-"+kind,"Generated a "+kind+" draft");
  }catch(e){S.tpl[l.id]={kind,error:friendly(e)}}
  save();if(S.sel===l.id)renderSide();
}

/* ---------- already a client ---------- */
let topping=false;
async function alreadyClient(l){
  if(S.swaps>=MAX_SWAPS){modal("swap");return}
  const i=S.leads.indexOf(l);if(i<0)return;
  S.swaps++;track("already-client","Marked already a client");
  const next=S.reserve.shift();
  if(next){next._new=true;S.leads.splice(i,1,next)}else S.leads.splice(i,1);
  S.sel=null;delete S.tpl[l.id];save();render();
  if(next){setTimeout(()=>{delete next._new},1700);resolveAll()}
  if(S.reserve.length<2&&!topping&&!S.sample&&LIVE()){
    topping=true;
    try{const more=await fetchLeads(6,"");const tmp=[];addUnique(more,tmp);S.reserve.push(...tmp);
      while(S.leads.length<LEADS&&S.reserve.length){const n=S.reserve.shift();n._new=true;S.leads.push(n)}
      save();if(S.step===4){render();resolveAll()}
    }catch(e){}finally{topping=false}
  }
}

/* ---------- modal ---------- */
function modal(kind){
  const el=document.createElement("div");
  el.className="modal";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-labelledby","mt");
  el.innerHTML=`<div class="box"><div class="em" aria-hidden="true">🔒</div><h2 id="mt">This is a test version</h2>
    <p>${kind==="day"?`You've already run today's 20-lead test. You can run a new one ${esc(nextTime())}. `:kind==="swap"?"You've swapped the most leads this test allows. ":kind==="email"?`You've used all ${MAX_EMAIL} email lookups in this test. `:""}Only the tool owner can generate unlimited leads. Feel free to contact Liron.</p>
    <div class="row"><a class="btn pri" href="../../index.html#contact">Contact Liron</a><button class="btn ghost" id="mclose">Close</button></div></div>`;
  document.body.appendChild(el);document.body.classList.add("modal-open");
  const close=()=>{el.remove();document.body.classList.remove("modal-open")};
  $("#mclose",el).onclick=close;el.onclick=e=>{if(e.target===el)close()};
  el.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  $(".btn.pri",el).onclick=()=>track("contact-liron","Clicked contact Liron");
  setTimeout(()=>$("#mclose",el).focus(),20);
}

/* ---------- CSV ---------- */
function downloadCSV(){
  const head=["Company","Website","Company LinkedIn","Contact name","Contact title","Email","Contact LinkedIn","Reach via","Fit","Why now"];
  const q=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=S.leads.map(l=>{const c=l.contact||{};return [l.company,l.website,l.linkedin||liCoSearch(l.company),c.role?"":c.name,c.title,c.email||"",c.linkedin||"",c.kind==="email"?"Email":"LinkedIn",l.fit,l.whyNow]});
  const csv="﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const name="reachlist-"+(S.company.domain||"leads").replace(/[^a-z0-9.-]/gi,"")+".csv";
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);track("csv","Downloaded CSV");
}

/* ---------- sample run (made-up data) ---------- */
function loadSample(){
  const names=["Bluebird Grocers","Cedarline Home","Harbor Outfitters","Pinecrest Pets","Lumen Skincare","Northgate Wines","Copperleaf Coffee","Tidewater Swim","Maple & Moss","Orbit Toys","Summit Trail Gear","Willow Baby","Ironbark Tools","Saffron Kitchen","Brightside Optics","Kestrel Bikes","Meadow Tea Co.","Granite Fitness","Juniper Jewelry","Coastline Surf","Hollow Oak Furniture","Velvet Paper Co.","Starling Audio","Fernwood Candles","Riverstone Shoes"];
  const firsts=["Maya","Daniel","Noa","Ethan","Lior","Sarah","Omer","Emma","Yael","Jacob","Tamar","Liam","Shira","Adam","Rotem","Olivia","Gal","Noah","Dana","Ben","Hila","Ava","Itai","Mia","Roni"];
  const lasts=["Carter","Levin","Brooks","Amir","Hayes","Peretz","Collins","Bar","Morgan","Shalev","Foster","Golan","Reed","Katz","Parker","Avraham","Bennett","Mizrahi","Hughes","Doron","Price","Navon","Ellis","Segal","Ward"];
  const titles=["VP Ecommerce","Head of Growth","Director of Digital","VP Marketing","Head of Ecommerce"];
  const whys=["Raised a Series A in the last quarter and is hiring two growth roles.","Launched a new online store in Europe this year.","Posted a job for a Head of Ecommerce last month.","Expanded to 40 new retail partners this year.","Hired a new CMO in the spring.","Opened a second warehouse to speed up delivery."];
  const mk=(i)=>{const d=names[i].toLowerCase().replace(/[^a-z]+/g,"-").replace(/-+$/,"")+".example";const e=i%3!==2;const n=firsts[i]+" "+lasts[i];
    return {id:"S"+i,company:names[i],website:"https://"+d,domain:d,linkedin:"",segment:i%2?"Online consumer brands":"Mid-size retailers",fit:96-i*2-(i%3),reasons:["Sells online with a large product catalogue","Team size matches the product's sweet spot"],whyNow:whys[i%whys.length],whyNowUrl:"",
      people:[{name:n,title:titles[i%titles.length],linkedin:"https://www.linkedin.com/in/sample"}],
      contact:e?{kind:"email",name:n,title:titles[i%titles.length],email:firsts[i].toLowerCase()+"@"+d,verified:i%2===0,confidence:91,chain:[{k:"Email finder",ok:true}]}:{kind:"li",name:n,title:titles[i%titles.length],linkedin:"https://www.linkedin.com/in/sample",chain:[{k:"Email finder",ok:false},{k:"LinkedIn profile",ok:true}]}}};
  const all=names.map((_,i)=>mk(i));
  S={step:4,sample:true,company:{name:"Northwind Analytics",website:"https://northwind.example",domain:"northwind.example"},
    info:{summary:"Made-up company: sells shelf and pricing analytics to consumer brands.",products:[{name:"Shelf Insights",oneLiner:"Shows brands where they lose sales on retailer sites, and why.",audiences:[{name:"Mid-size retailers",why:""},{name:"Online consumer brands",why:""}],roles:[{name:"VP Ecommerce",why:""},{name:"Head of Growth",why:""}]}],markets:["Worldwide"]},
    product:0,aud:["Mid-size retailers","Online consumer brands"],roles:["VP Ecommerce","Head of Growth"],markets:["Worldwide"],
    leads:all.slice(0,LEADS),reserve:all.slice(LEADS),seen:all.map(l=>l.domain),swaps:0,sel:null,tpl:{}};
  error="";busy="";save();render();track("sample","Opened the sample run");
}
function sampleTpl(l,kind,first){
  return kind==="email"?{kind,subject:`Quick idea for ${l.company}`,body:`Hi ${first||"there"},\n\nI saw that ${l.company} ${l.whyNow.charAt(0).toLowerCase()+l.whyNow.slice(1)} Congrats. Teams at that stage often lose sales on retailer sites without seeing why.\n\nShelf Insights shows exactly where shoppers drop off and what to fix first, usually within the first week.\n\nWorth a 15-minute call next week to see it on ${l.company}'s own listings?\n\n[Your name]`}
    :{kind,body:`Hi ${first||""}, saw that ${l.company} ${l.whyNow.charAt(0).toLowerCase()+l.whyNow.slice(1).replace(/\.$/,"")}. I work on shelf analytics for brands like yours and would love to connect.`};
}

render();
if(S.step===4&&!S.sample&&S.leads.some(l=>!l.contact))ready.then(()=>resolveAll());
})();
