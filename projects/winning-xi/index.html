<style>
/* Layout: sticky club bar with tabs; one main column of panels (hub, builder, match, result); player detail opens in a side drawer. Scoreboard band is the signature element. */
:root{
  --bg:#eceef3; --surface:#ffffff; --surface2:#f5f6f9; --line:#d7dbe4; --fg:#121828; --muted:#5a6279;

  --pitch:#1f6b3a; --pitch2:#23763f;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --surface:#141a2b; --surface2:#1a2135; --line:#283048; --fg:#e8ebf4; --muted:#9aa3bb;
  --ink:#a9c1ff; --good:#3cc779; --warn:#f0a63a; --bad:#ff5c63; --board:#060a14; --pitch:#174f2c; --pitch2:#1a5831; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#141a2b; --surface2:#1a2135; --line:#283048; --fg:#e8ebf4; --muted:#9aa3bb;
  --ink:#a9c1ff; --good:#3cc779; --warn:#f0a63a; --bad:#ff5c63; --board:#060a14; --pitch:#174f2c; --pitch2:#1a5831; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--board);color:var(--board-fg)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{display:inline-block;width:10px;height:22px;background:var(--t1);transform:skewX(-14deg)}
.clubchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--board-muted)}
.chipbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;border-radius:10px;color:inherit;font:inherit;text-align:left;cursor:pointer}.chipbtn:hover{background:rgba(255,255,255,.08)}.chipbtn:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:transparent;border:0;color:var(--board-muted);padding:6px 10px;border-radius:6px;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.tabs button[aria-current="page"]{color:var(--board-fg);background:rgba(255,255,255,.08);box-shadow:inset 0 -2px 0 var(--t1)}
@media (max-width:640px){
 .top .wrap{gap:6px 12px;padding-block:8px}
 .brand{font-size:18px}.brand i{height:18px;width:8px}
 .clubchip span{display:none}.clubchip .crest{width:28px;height:28px;font-size:11px}
 .tabs{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .tabs button{font-size:15px;padding:4px 10px;white-space:nowrap}
}
main{padding-block:20px 48px}
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sp{justify-content:space-between}
.hint{color:var(--muted);font-size:13px;margin:0}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500}

.btn.primary{background:var(--t1);border-color:var(--t1);color:var(--t2);font-weight:600}

.big{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding:10px 22px}

.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.out{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}

.wl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff}
.wl.W{background:var(--good)}.wl.D{background:#7d869c}.wl.L{background:var(--bad)}

/* team picker */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* scoreboard */
.board{background:var(--board);color:var(--board-fg);border-radius:12px;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}

.board .side.r{justify-content:flex-end;text-align:right}
.board .nm{font-family:var(--display);font-weight:700;font-size:clamp(18px,3vw,26px);text-transform:uppercase;line-height:1.05}
.board .sub{color:var(--board-muted);font-size:12px}
.board .mid{text-align:center}
.board .score{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:.02em}

@media (max-width:560px){.board{grid-template-columns:1fr;text-align:center}.board .side,.board .side.r{justify-content:center;text-align:center}.board .side.r{flex-direction:row-reverse}}

/* lists */
.lst{display:grid;gap:2px}

/* squad cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;border:1px solid var(--line);border-radius:10px;background:linear-gradient(160deg,var(--surface2),var(--surface));padding:10px;text-align:left;display:grid;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 11px;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--fg);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,8,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:grid;gap:14px;align-content:start;border-left:1px solid var(--line)}
.attr{display:grid;grid-template-columns:44px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:12px}

.r-hi{background:color-mix(in srgb,var(--good) 24%,transparent)}

.pitch{position:relative;aspect-ratio:68/82;max-width:100%;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%)}

.plist{display:grid;gap:3px;max-height:440px;overflow:auto;padding-right:2px}
.p{display:grid;grid-template-columns:28px minmax(0,1fr) auto 40px;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.p:hover{border-color:var(--line)}

.seg button[aria-pressed="true"]{background:var(--t1);color:var(--t2)}

.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.mgrid{grid-template-columns:1fr}}
.feed{display:grid;gap:2px;max-height:420px;overflow:auto;font-size:13px}
.ev{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:5px 4px;border-bottom:1px solid var(--line)}

.ev.goal{background:color-mix(in srgb,var(--t1) 20%,transparent);font-weight:600}
.ev.goal.them{background:color-mix(in srgb,var(--o1) 16%,transparent)}
.ev.card .m::after{content:""}

.flow{position:relative;height:56px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--t1) 20%,var(--surface2)),var(--surface2) 50%,color-mix(in srgb,var(--o1) 20%,var(--surface2)));overflow:hidden}

.mstats .v{font-family:var(--mono);text-align:center}
.mstats .k{text-align:center;color:var(--muted);font-size:12px}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);grid-column:1/-1}
.sbar i{display:block;height:100%}
.decision{border:2px solid var(--t1);background:color-mix(in srgb,var(--t1) 8%,var(--surface))}
.alert{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--surface2);border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.alert b{font-weight:600}
.speed button{padding:4px 10px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--t1);transition:width .2s linear}
.foot{color:var(--muted);font-size:12px;max-width:80ch}

/* position pop-up */
.pitchwrap{overflow:visible}
.pop{position:absolute;z-index:5;width:min(300px,86%);max-height:min(380px,80%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);overflow:hidden}
.pophead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.pophead b{font-family:var(--display);font-size:17px;text-transform:uppercase}
.x{background:none;border:0;font-size:20px;line-height:1;padding:2px 6px;color:var(--muted)}
.poplist{overflow:auto;padding:4px;display:grid;gap:2px;align-content:start}
.pophint{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 6px 2px}
.popfoot{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid var(--line)}
.popfoot:empty{display:none}
.cand{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:left;width:100%}
.cand:hover:not(:disabled),.cand:focus-visible{border-color:var(--line);background:var(--surface2)}
.cand:disabled{opacity:.45;cursor:not-allowed}
.cand .cn b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .cn small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .act{font-size:11px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.slot.drag{touch-action:none;cursor:grab}.slot.dragging{cursor:grabbing;z-index:6}.slot.dragging .dot{box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.4)}
.dragtip{position:absolute;transform:translateX(-50%);background:var(--board);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;pointer-events:none;z-index:7}
.nudge{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}.nudge .btn{padding:3px 8px}
.injm{position:absolute;top:-4px;left:16px;width:14px;height:14px;border-radius:50%;background:#e11;color:#fff;font-size:11px;line-height:14px;font-weight:700}
.linkish{background:none;border:0;padding:0;text-align:left;color:var(--fg)}
@media (max-width:560px){.pop{position:fixed;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100%;max-height:62vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}}
/* projection */
.bar3{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar3 i{display:block;height:100%}
.legend3{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend3 b{color:var(--fg);font-family:var(--mono)}
.sc{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.sc.best{border-color:var(--t1);background:color-mix(in srgb,var(--t1) 18%,transparent);font-weight:600}
/* live pitch */
.live-label{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;min-height:24px}
.hpitch{border-radius:10px;overflow:hidden;background:var(--pitch)}

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

// ===================== PLAYER MODEL =====================
function level(p){
  const lv=58+8*log10(Math.max(p.v||150,100)/100);
  let rr=null,m=p.m||0;
  if(p.r&&m>=60) rr={r:p.r,m};
  else if(p.ls&&p.ls.r) rr={r:p.ls.r,m:Math.min(p.ls.m||600,900)*0.6};
  let L=lv;
  if(rr){const lr=66+9*(rr.r-6.9),w=Math.min(.7,rr.m/(rr.m+300));L=w*lr+(1-w)*lv}
  if(p.caps>=50)L+=3;else if(p.caps>=20)L+=2;else if(p.caps>=10)L+=1;
  if(p.top)L+=1.5;
  if(p.age>=33)L-=1.5;
  if(p.youth&&m<200)L-=6;
  return L;
}
function buildDetailed(p,teamKey){
  const m=p.m||0,per=x=>x==null?null:x*90/Math.max(m,1),w=m/(m+450);
  const NP=naturalPos(p,teamKey),posL=NP.pos;
  const g=GROUP[posL[0]],off=OFF[g],L=level(p);
  const has=(...k)=>k.some(x=>p[x]!=null);
  const s={};
  if(has("sh","g")&&m>0) s.SHO=.45*cap(per(p.g||0),.6)+.35*cap(per(p.sot||0),1.4)+.2*(p.sh?lin((p.sot||0)/p.sh,.2,.6):.4);
  if(p.pp!=null&&g!=="GK") s.PAS=.35*lin(p.pp,70,92)+.25*cap(per(p.pa||0),55)+.25*cap(per(p.cc||0),2.2)+.15*cap(per(p.lb||0),5);
  if(has("to","dr")&&m>0) s.DRI=.4*cap(per(p.dr||0),2.2)+.2*(p.drp!=null?lin(p.drp,25,65):.4)+.2*(1-cap(per(p.ds||0),2.5))+.2*cap(per(p.fw||0),2.5);
  if(has("tk","cl")&&m>0) s.DEF=.28*cap(per(p.tk||0),3)+.2*cap(per(p.it||0),2)+.2*cap(per(p.cl||0),5)+.12*cap(per(p.bl||0),.8)+.1*(p.dp!=null?lin(p.dp,35,65):.4)+.1*(1-cap(per(p.dpst||0),1.5));
  if(has("aw","dw")&&m>0) s.PHY=.35*(p.ap!=null?lin(p.ap,25,75):.4)+.25*cap(per(p.aw||0),4)+.25*(p.dp!=null?lin(p.dp,35,65):.4)+.15*cap(per(p.rc||0),7);
  const at={},est={};
  for(const a of ATTRS){
    const pr=off[a];
    if(s[a]!=null){at[a]=L+(1-w)*pr+w*(.4*pr+24*(s[a]-.5));est[a]=w<.35}
    else{at[a]=L+pr;est[a]=true}
  }
  const ageAdj=p.age>29?-(p.age-29)*1.5:p.age<23?2:0;
  at.PAC+=ageAdj+(s.DRI!=null?w*.4*24*(s.DRI-.5):0);est.PAC=true;
  if(p.h)at.PHY+=(p.h-181)*.45;
  for(const a of ATTRS)at[a]=Math.round(clamp(at[a],25,95));
  const o={id:p.n,team:teamKey,name:p.n,full:p.full||p.n,no:p.no,pos:posL,listed:p.pos,share:NP.share,usage:NP.usage,posSrc:NP.src,age:p.age,h:p.h,ft:p.ft,v:p.v,L,at,est,raw:p,detailed:true};
  if(g==="GK"){
    const ss=p.svp!=null?lin(p.svp,55,80):.5,di=p.pp!=null?.6*lin(p.pp,55,90)+.4*lin(p.lbp||40,30,65):.5,wg=m/(m+400);
    o.gk={STOP:Math.round(clamp(L+6+wg*24*(ss-.5),35,95)),DIST:Math.round(clamp(L+wg*24*(di-.5),35,95)),COMM:Math.round(clamp(L+((p.h||188)-188)*.8+2,35,95))};
    o.gkr=Math.round(.6*o.gk.STOP+.2*o.gk.DIST+.2*o.gk.COMM);
  }
  const prior=["CB","DM"].includes(posL[0])?.2:.12;
  o.card90=(1-w)*prior+w*(((p.y||0)+2.5*(p.red||0))*90/Math.max(m,1));
  const ag=p.age||25;o.sta=clamp(80-Math.max(0,ag-29)*2.2-(ag<21?3:0)+(m>350?3:0),55,90);
  o.lowData=m<300&&!p.ls;

}

function teamStrength(k){const t=realTable().find(r=>r[0]===k);if(!t)return 3;const [,P,W,D,,GF,GA]=t;return 1.7*(3*W+D)/P+1.5*(GF-GA)/P}
function finish(o){
  o.isGK=o.pos[0]==="GK";

  for(const r of Object.keys(ROLEW).concat("GK"))o.roles[r]=roleRating(o,r);
  o.best=o.pos.reduce((b,r)=>o.roles[r]>o.roles[b]?r:b,o.pos[0]);
  o.ovr=o.roles[o.pos[0]];
  return o;
}
function fam(o,r){
  const sh=o.share&&o.share[r];
  if(sh!=null)return sh>=.3?0:sh>=.1?1:2;
  if(o.pos.includes(r))return o.share?2:0;
  if(o.pos.some(p=>GROUP[p]===GROUP[r]))return 2;
  if(o.pos.some(p=>(ADJ[p]||[]).includes(r)))return 3;
  return 6;
}
function roleRating(o,r){
  if(r==="GK")return o.isGK?o.gkr:28;
  if(o.isGK)return Math.round(o.L-26);
  const w=ROLEW[r];let s=0;for(const a in w)s+=w[a]*o.at[a];

}
function traits(o){
  const vals=ATTRS.map(a=>o.at[a]),mean=vals.reduce((x,y)=>x+y,0)/6;
  const PRO={PAC:"Quick over the ground",SHO:"Dangerous in front of goal",PAS:"Tidy, progressive passer",DRI:"Beats players one-on-one",DEF:"Reads danger and wins the ball back",PHY:"Strong in duels and in the air"};
  const CON={PAC:"Lacks pace",SHO:"Rarely threatens the goal",PAS:"Loose in possession",DRI:"Limited on the ball",DEF:"Exposed defensively",PHY:"Can be outmuscled"};
  const pros=[],cons=[];
  if(o.isGK){
    if(o.gk.STOP>=o.gkr+2)pros.push("Good shot-stopper");if(o.gk.DIST>=o.gkr+1)pros.push("Comfortable with the ball at his feet");if(o.gk.COMM>=o.gkr+3)pros.push("Commands his box");
    if(o.gk.DIST<=o.gkr-4)cons.push("Distribution can be erratic");if(o.gk.STOP<=o.gkr-3)cons.push("Concedes too many of the shots he faces");
  }else{
    ATTRS.slice().sort((a,b)=>o.at[b]-o.at[a]).forEach((a,i)=>{if(i<2&&o.at[a]>=mean+3)pros.push(PRO[a])});
    ATTRS.slice().sort((a,b)=>o.at[a]-o.at[b]).forEach((a,i)=>{if(i<2&&o.at[a]<=mean-5&&!(a==="SHO"&&["CB","FB"].includes(GROUP[o.pos[0]])))cons.push(CON[a])});
  }
  const r=o.raw||{},m=r.m||0,per=x=>(x||0)*90/Math.max(m,1),tags=[];
  if(o.detailed&&m>=150){
    if(r.ap>=65&&per(r.aw)>=1.8)tags.push("Aerial threat");
    if(per(r.cc)>=1.4)tags.push("Creator");
    if(per((r.tk||0)+(r.it||0))>=3.5)tags.push("Ball winner");
    if(per(r.g)>=.45)tags.push("Goal threat");
    if(r.pp>=90&&per(r.pa)>=40)tags.push("Press-resistant");
    if(per(r.dpst)>=1.6)tags.push("Can be dribbled past");
  }
  if(o.raw&&!o.raw.season&&o.raw.y===4)tags.push("One booking from a ban");
  if(o.card90>=.28)tags.push("Card risk");
  if(o.age>=30&&(o.raw.caps||0)>=20)tags.push("Experienced leader");
  if(o.h&&o.h>=188)tags.push("Tall");
  if(o.age<=21)tags.push("Young talent");
  return{pros,cons,tags};
}

// best XI for a formation: an exact assignment (Hungarian method) maximising the XI's total,
// where each player gets a bonus for roles he really plays (scaled by his share of minutes there)
// + up to 4 for a regular starter (share of the club's recorded lineups he started)
// roles in the same family (e.g. DM/CM/AM) count half: a central midfielder is at home anywhere in the middle
const FAMILY={DM:"C",CM:"C",AM:"C",LM:"L",LW:"L",RM:"R",RW:"R",LB:"LB",LWB:"LB",RB:"RB",RWB:"RB",CB:"CB",ST:"ST",GK:"GK"};
function fitB(p,s){const reg=p.usage?4*Math.min(1,p.usage.starts/Math.max(1,allLineups(p.team).length)):0;
  if(p.share){let fam=0;for(const r in p.share)if(r!==s&&FAMILY[r]===FAMILY[s])fam+=p.share[r];return p.roles[s]+reg+5*(p.share[s]||0)+2.5*fam}
  return p.roles[s]+reg+(p.pos[0]===s?4:p.pos.includes(s)?1:0)}
function hungarian(cost){ // square matrix, minimise
  const n=cost.length,u=Array(n+1).fill(0),v=Array(n+1).fill(0),pp=Array(n+1).fill(0),way=Array(n+1).fill(0);
  for(let i=1;i<=n;i++){pp[0]=i;let j0=0;const minv=Array(n+1).fill(Infinity),used=Array(n+1).fill(false);
    do{used[j0]=true;const i0=pp[j0];let d=Infinity,j1=0;
      for(let j=1;j<=n;j++)if(!used[j]){const c=cost[i0-1][j-1]-u[i0]-v[j];if(c<minv[j]){minv[j]=c;way[j]=j0}if(minv[j]<d){d=minv[j];j1=j}}
      for(let j=0;j<=n;j++){if(used[j]){u[pp[j]]+=d;v[j]-=d}else minv[j]-=d}j0=j1}while(pp[j0]!==0);
    do{const j1=way[j0];pp[j0]=pp[j1];j0=j1}while(j0)}
  const res=Array(n).fill(-1);for(let j=1;j<=n;j++)if(pp[j])res[pp[j]-1]=j-1;return res;
}
function bestXI(squad,form,ok){
  ok=ok||(()=>true);
  const pool=squad.filter(p=>ok(p.id)),slots=(Array.isArray(form)?form:FORMS[form]).map(s=>s[0]);
  const n=Math.max(pool.length,slots.length),cost=[];
  for(let i=0;i<n;i++){const row=[];for(let j=0;j<n;j++)row.push(i<slots.length&&j<pool.length?-fitB(pool[j],slots[i]):0);cost.push(row)}
  const a=hungarian(cost);
  return slots.map((s,i)=>a[i]>-1&&a[i]<pool.length?pool[a[i]].id:null);
}

function estimateOut(team,name){

  const t=((n&&n.text)||"").toLowerCase(),games=d=>REAL.fixtures.filter(f=>!f.cup&&(f.home===team||f.away===team)&&f.date>=REAL.updated&&f.date<d).length;
  const M=["january","february","march","april","may","june","july","august","september","october","november","december"];
  const mi=M.findIndex(m=>t.includes(m));
  if(mi>-1){const yr=mi<6?2027:2026,day=t.includes("early")?5:t.includes("late")?25:15;return Math.max(1,games(`${yr}-${String(mi+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`))}

  const top=Object.entries(goals).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const gd=r=>{const x=resFor(k,r);return x.gf-x.ga},best=games.slice().sort((a,b)=>gd(b)-gd(a))[0],worst=games.slice().sort((a,b)=>gd(a)-gd(b))[0];
  const ord3={L:0,D:1,W:2},withPre=games.filter(r=>r.pre);let beat=0,match=0;withPre.forEach(r=>{const o=ord3[resFor(k,r).res],e=ord3[r.pre.mode];if(o>e)beat++;else if(o===e)match++});

const PITCH_LINES=`<svg viewBox="0 0 68 82" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".35"><rect x="2" y="2" width="64" height="78"/><path d="M24 2v6h20V2"/><rect x="14" y="64" width="40" height="16"/><rect x="25" y="74" width="18" height="6"/><path d="M27 64a9 9 0 0 1 14 0"/><circle cx="34" cy="2" r="9"/></svg>`;

function lineupPitch(shape,slots,team,opts){

  let h=PITCH_LINES+shape.map(([,x,y],i)=>{const pos=slots[i].pos;const sl=slots[i],p=sl&&sl.pid?pById(team,sl.pid):null,inf=p&&opts.info?opts.info(p.id):null;
    const r=p?Math.round(p.roles[pos]*(inf&&inf.fit!=null?(.8+.2*inf.fit/100):1)):null,off=p&&p.roles[pos]<p.ovr-1;
    return`<button class="slot ${p?"f":""} ${pop===i?"sel":""} ${opts.drag&&pos!=="GK"?"drag":""}" data-slot="${i}" style="left:${x}%;top:${y}%" aria-label="${p?esc(p.name)+", "+pos+", rating "+r:"Empty "+pos+" spot"}" aria-expanded="${pop===i}">
     ${p&&opts.kit?`<span class="dot kitd">${kitSVG(team,p,44)}<span class="rtg">${r}</span></span>`:`<span class="dot">${p?r:pos}</span>`}${opts.badge&&p?opts.badge(p):""}${inf&&inf.y?'<span class="yc"></span>':""}${inf&&inf.inj?'<span class="injm">+</span>':""}<span class="nm ${off?"off":""}">${p?esc(p.name):"Pick "+pos}</span>${inf&&inf.fit!=null?`<span class="fit"><i style="width:${inf.fit}%;background:${inf.fit<45?"#ff6b6b":inf.fit<65?"#ffd166":"#7CFC9A"}"></i></span>`:""}</button>`}).join("");
  if(pop!=null&&opts.popHTML){const [,x,y]=shape[pop];
    const hz=x<50?`left:calc(${x}% + 34px)`:`right:calc(${100-x}% + 34px)`,vt=y>55?`bottom:calc(${100-y}% - 30px)`:`top:calc(${y}% - 30px)`;

// the role a spot gets from where it sits (x: left 0 to right 100, y: attack 0 to own goal 100)
function roleAt(x,y){const wide=x<25||x>75,L=x<50;
  if(y<=20)return wide?(L?"LW":"RW"):"ST";
  if(y<=33)return wide?(L?"LW":"RW"):"AM";
  if(y<=43)return wide?(L?"LM":"RM"):"CM";
  if(y<=56)return wide?(L?"LWB":"RWB"):"DM";
  if(y<=62)return wide?(L?"LWB":"RWB"):"CB";
  return wide?(L?"LB":"RB"):"CB"}
function moveSpot(shape,i,x,y){if(shape[i][0]==="GK")return;x=clamp(Math.round(x),6,94);y=clamp(Math.round(y),8,78);shape[i]=[roleAt(x,y),x,y]}
function enableDrag(box,shape,onDrop,onTap){if(!box)return;

    b.onpointerdown=e=>{if(e.button>0)return;st={x:e.clientX,y:e.clientY,moved:false};try{b.setPointerCapture(e.pointerId)}catch(_){}};
    b.onpointermove=e=>{if(!st||shape[i][0]==="GK")return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)<7)return;st.moved=true;
      const r=box.getBoundingClientRect(),x=clamp((e.clientX-r.left)/r.width*100,6,94),y=clamp((e.clientY-r.top)/r.height*100,8,78);

      let tip=box.querySelector(".dragtip");if(!tip){tip=document.createElement("div");tip.className="dragtip";box.appendChild(tip)}tip.textContent=roleAt(x,y);tip.style.left=x+"%";tip.style.top=`calc(${y}% - 46px)`};
    b.onpointerup=e=>{if(!st)return;const moved=st.moved;st=null;const tip=box.querySelector(".dragtip");if(tip)tip.remove();
      if(moved){const r=box.getBoundingClientRect();onDrop(i,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)}else onTap(i)};

// ===================== MATCH ENGINE =====================
// ---------- team context: real results, form, home/away record, rest days ----------
// How well a club is actually doing (goals for and against per game, last five results, home and away record)
// nudges the player-based ratings. Every effect is shrunk toward the league average, so a few games can't swing it much.
const CTX={K:6,W:.3,FORM:.02,HOME:1.07};
const EUROPE=[{team:"hbs",date:"2026-10-15"},{team:"hbs",date:"2026-10-22"},{team:"hbs",date:"2026-11-05"},{team:"hbs",date:"2026-11-26"},{team:"hbs",date:"2026-12-10"},{team:"hbs",date:"2026-12-17"}];
function teamCtx(team,date){
  const RES=curResults(),lg=RES.filter(r=>!r.cup&&r.date<date);
  const G=lg.length?lg.reduce((a,r)=>a+r.hg+r.ag,0)/(2*lg.length):1.35;
  const mine=lg.filter(r=>r.home===team||r.away===team).sort((a,b)=>a.date<b.date?-1:1);
  // a club's strength is learned from real results only; simulated games feed form and fatigue, never strength (no feedback loop)
  const sm=simS(),strong=sm?mine.filter(r=>!sm.results.includes(r)):mine;
  let gf=0,ga=0,pts=0,hp=0,hn=0,ap=0,an=0;
  strong.forEach(r=>{const x=resFor(team,r),pt=x.res==="W"?3:x.res==="D"?1:0;gf+=x.gf;ga+=x.ga;pts+=pt;if(x.home){hp+=pt;hn++}else{ap+=pt;an++}});

  const atk=(gf+K*G)/((n+K)*G),def=(ga+K*G)/((n+K)*G); // 1 = league average
  const last=mine.slice(-5);const l5=last.length?last.reduce((a,r)=>{const x=resFor(team,r);return a+(x.res==="W"?3:x.res==="D"?1:0)},0)/last.length:0;
  const ppg=n?pts/n:0,form=n>=3?clamp(CTX.FORM*(l5-ppg),-.06,.06):0;
  const split=hn&&an?(hp/hn-ap/an):0.4,edge=clamp((split-.4)*(hn+an)/(hn+an+12)*.08,-.05,.05);
  // days since the club's last game (league, cup or Europe)
  const prev=RES.concat(curFixtures()).filter(r=>(r.home===team||r.away===team)&&r.date<date).map(r=>r.date).concat(EUROPE.filter(e=>e.team===team&&e.date<date).map(e=>e.date)).sort().pop();
  const rest=prev?Math.round((new Date(date)-new Date(prev))/864e5):7;

}

function chance(M,att,def,m,pen){

    let asTxt="";if(!pen&&rand(M)<.72){const as=pickW(M,pool.filter(x=>x.pid!==sh.pid),x=>{const q=pById(att.team,x.pid);return Math.pow(q.at.PAS/70,2)*(W_ATT[x.pos]+.2)});if(as){att.P[as.pid].a++;att.P[as.pid].rating+=.6;asTxt=` Assist: ${pById(att.team,as.pid).full}.`}}

function subSide(M,s,sl,m){ // automatic substitution (opponent, or your side in background runs)

function oppManager(M,s,o,m){

function strip(M){const c=JSON.parse(JSON.stringify(Object.assign({},M,{log:[],frames:[],pending:null,proj:null,pre:null,lastSum:null,decision:null,timer:null,replay:null})));c.quiet=true;return c}

    runs.push({rs:rs0,mg:c.mine.goals,tg:c.them.goals,pens:c.pens,xm:c.mine.xg,xt:c.them.xg,sm:c.mine.shots,st:c.them.shots,poss:c.possN?c.possA/c.possN:.5})}

  const mode=["W","D","L"].sort((a,b)=>cnt[b]-cnt[a])[0];
