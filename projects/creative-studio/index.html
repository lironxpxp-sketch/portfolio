function url(v){v=String(v||"").trim();return /^https?:\/\/\S+$/i.test(v)?v:""}
function hex(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||"").trim())?String(v).trim():d}

async function suggestConcepts(fresh){

- Hooks must stop the scroll: a vivid scenario, a surprising truth, a pointed question, a confession, a playful twist, or a bold claim the brief supports. Max 40 characters.

    try{const r=await ask(prompt,"Finding messaging concepts…");S.usedAI=true;
      const list=(Array.isArray(r)?r:r.concepts||[]).filter(c=>c&&c.hook).slice(0,6);

      S.notice="The AI didn't return any concepts. Try again.";render();return;
    }catch(e){const k=aiError(e);if(k!=="fallback"){render();return}}
  }

function templateConcepts(b,shift){
  const n=b.name,pain=lc(b.pain)||"the usual hassle",aud=b.audience||"people like you",what=lc(b.what)||"what you need";
  const sets=[
    ["Pain","Name the problem",`${n} takes ${pain} off your plate.`,[`Still dealing with ${pain}?`,`Done with ${pain}?`]],
    ["Outcome","Show the result",b.proof?`${cap(b.proof)}.`:`${cap(what)}, without the hassle.`,[b.proof?cap(b.proof):`Get results that last`,`See the difference in weeks`]],
    ["Social proof","Peers already use it",`${cap(aud)} choose ${n} for ${what}.`,[`Why ${aud} choose ${n}`,`The pick for ${aud}`]],
    ["Curiosity","The simple fix",`There is an easier way to handle ${pain}.`,[`The simple fix for ${pain}`,`What works when nothing else did`]],
    ["Objection","Easier than you think",`Getting started with ${n} is quick and low-risk.`,[`Easier to start than you think`,`No big commitment to start`]],
    ["Urgency","Start now",`Every week you wait, ${pain} costs you more.`,[`Start this week, not someday`,`Your best month starts now`]]];
  return sets.map(([angle,title,message,hooks],i)=>({angle,title,message,hook:hooks[(shift+i)%2]}));
}

function fit(s,max){s=String(s||"").trim();if(s.length<=max)return s;const cut=s.slice(0,max-1);const sp=cut.lastIndexOf(" ");return (sp>max*.6?cut.slice(0,sp):cut).replace(/[,.;:\s]+$/,"")+"…"}
function templateCreative(p,c,b){

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t||!t.closest(".wrap"))return;
  if(t.dataset.go){S.step=+t.dataset.go;S.notice="";render();return}
  if(t.dataset.ab){const c=S.creatives[+t.dataset.i];c.v=t.dataset.ab;render();return}
  if(t.dataset.prod){pickProduct(+t.dataset.prod);render();return}
  if(t.dataset.plat){const k=t.dataset.plat;S.platforms.has(k)?S.platforms.delete(k):S.platforms.add(k);S.creatives=[];render();return}
  if(t.dataset.con){const i=+t.dataset.con;if(S.picked.has(i))S.picked.delete(i);else if(S.picked.size<3)S.picked.add(i);else{S.notice="You can pick up to three concepts. Deselect one first."}render();S.notice="";return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  const a=t.dataset.act;if(!a)return;
  if(a==="stop"){S.ctl&&S.ctl.abort();return}
  if(a==="back"){S.step=Math.max(0,S.step-1);S.notice="";render();return}
  if(a==="next"){S.step++;S.notice="";render();return}
  if(a==="example"){applyExample();return}
  if(a==="concepts"){S.step=2;if(!S.concepts.length){await suggestConcepts(false)}else render();return}
  if(a==="reconcepts"){await suggestConcepts(true);return}
  if(a==="create"){Object.keys(IMGS).forEach(k=>delete IMGS[k]);S.step=STEPS().length-1;await create();return}
  if(a==="restart"){Object.assign(S,{step:0,mode:"company",url:"",paste:"",profile:null,company:null,product:-1,brief:null,concepts:[],creatives:[],notice:"",usedAI:false,plan:null,limitHit:false});S.picked.clear();render();return}
  if(a==="resize"){queueSizes(+t.dataset.i);render();pumpImages();return}
  if(a==="resizeall"){S.creatives.forEach((c,i)=>queueSizes(i));render();pumpImages();return}
  if(a==="replan"){makePlan();return}
  if(a==="copyplan"){try{await navigator.clipboard.writeText(planText());t.textContent="Copied"}catch(err){t.textContent="Copy failed"}setTimeout(()=>{t.textContent="Copy plan"},1600);return}
  if(a==="nologo"){S.brief.logoUpload="";if(S.company)S.company.logoUpload="";render();return}
  if(a==="copy"){const c=S.creatives[+t.dataset.i],txt=PLAT[c.platform].fields.map(f=>{const v=F(c)[f.k];return Array.isArray(v)?v.map((x,j)=>`${f.l} ${j+1}: ${x}`).join("\n"):`${f.l}: ${v||""}`}).join("\n");
    try{await navigator.clipboard.writeText(txt);t.textContent="Copied"}catch(err){t.textContent="Copy failed. Select the text instead."}setTimeout(()=>{t.textContent="Copy text"},1600);return}
  if(a==="csv"){const {csv,fn}=buildCsv();await saveBlob(fn,new Blob(["\ufeff"+csv],{type:"text/csv"}));return}
  if(a==="png"){const c=S.creatives[+t.dataset.i],w=+t.dataset.w,h=+t.dataset.h;t.textContent="Saving…";
    const blob=await adPng(c,w,h);await saveBlob(`${fileSlug(S.brief.name)}-${c.platform}-${fileSlug(c.concept)}-${w}x${h}.png`,blob);t.textContent="Download PNG";return}
  if(a==="zip"){t.disabled=true;t.textContent="Building ZIP…";try{await loadZip();const z=new JSZip(),{csv,fn}=buildCsv();z.file(fn,"\ufeff"+csv);
      if(S.plan&&!S.plan.loading&&!S.plan.err)z.file("campaign-plan.txt",planText());
      for(const c of S.creatives){const i=S.creatives.indexOf(c);for(const [nm,w,h] of PLAT[c.platform].sizes){if(aiImages()&&!(IMGS[imgKey(i,w,h)]||{}).url)continue;z.file(`${PLAT[c.platform].name}/${fileSlug(c.concept)}-${w}x${h}.png`,await adPng(c,w,h))}}
      await saveBlob(`${fileSlug(S.brief.name)}-creatives.zip`,await z.generateAsync({type:"blob"}))}catch(err){S.notice="Couldn't build the ZIP. Try downloading images one by one.";render()}
    t.disabled=false;t.textContent="Download all (ZIP)";return}
  if(a==="noupload"){S.brief.upload="";render();return}
  if(a==="retryimg"){const i=+t.dataset.i;IMGS[imgKey(i,+t.dataset.w,+t.dataset.h)]={queued:true};render();pumpImages();return}
});
document.addEventListener("submit",e=>{if(e.target.id==="siteform"){e.preventDefault();analyze()}});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset&&el.dataset.fmt!=null){const c=S.creatives[+el.dataset.fmt];c._userFmt=true;c.visual=fillVisual({...c.visual,_concept:c.concept,format:el.value},S.brief);paintAll();return}
  if(el.id==="f-logo"&&el.files&&el.files[0]){const f=el.files[0];if(!/^image\/(png|jpeg|webp)$/.test(f.type)){S.notice="Upload the logo as a PNG, JPG or WebP image.";render();return}
    const rd=new FileReader();rd.onload=async()=>{let u=rd.result;try{const im=await loadEl(u),k=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");
      cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);u=cv.toDataURL("image/png")}catch(x){}
      S.brief.logoUpload=u;if(S.company)S.company.logoUpload=u;render()};rd.readAsDataURL(f);return}
  if(el.id==="f-upload"&&el.files&&el.files[0]){const f=el.files[0];if(!/^image\//.test(f.type)){S.notice="That file isn't an image.";render();return}
    const rd=new FileReader();rd.onload=async()=>{let u=rd.result;try{const im=await loadEl(u),k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");
      cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);u=cv.toDataURL("image/jpeg",.88)}catch(x){}
      S.brief.upload=u;if(S.company&&S.product>=0)S.company.upload=u;render()};rd.readAsDataURL(f)}});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset&&el.dataset.f&&S.brief){S.brief[el.dataset.f]=el.value;S.concepts=[];S.creatives=[];
    if(S.company&&S.product>=0){const p=S.company.products[S.product];if(["name","what","audience","pain","proof"].includes(el.dataset.f))p[el.dataset.f]=el.value;if(["bg","accent","font","tone"].includes(el.dataset.f))S.company[el.dataset.f]=el.value}
    if(el.dataset.f==="font"||el.dataset.f==="bg"||el.dataset.f==="accent"){const pv=document.querySelector(".kit .fprev");if(pv){pv.style.fontFamily=`'${S.brief.font||"inherit"}',var(--f-display)`;pv.style.color=S.brief.accent}}
    rail();return}
  if(el.id==="goal"){S.goal=el.value;S.creatives=[];return}
  if(el.id==="paste"){S.paste=el.value;return}
  if(el.isContentEditable){const c=S.creatives[+el.dataset.i],k=el.dataset.k,j=+el.dataset.j,t=el.textContent,FF=F(c);
    if(j>=0){if(!Array.isArray(FF[k]))FF[k]=[];FF[k][j]=t}else FF[k]=t;count(el.closest(".field"))}
});
render();
})();
</script>
