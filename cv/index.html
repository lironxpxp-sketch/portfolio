.line{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}

.lab{fill:var(--ink);font-family:var(--display);font-size:30px}
.lab.small{font-family:var(--mono);font-size:22px;fill:var(--ink-dim);letter-spacing:.04em}

.overlay{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:5%;background:transparent;cursor:pointer}
.playbig{font:600 1.05rem var(--body);color:#0A1218;background:var(--amber);border:0;border-radius:999px;padding:12px 22px;cursor:pointer;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.playbig:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.main{display:grid;gap:16px}
.left{display:grid;gap:12px;min-width:0}
.side{display:grid;gap:14px;align-content:start;min-width:0}
.caption{display:grid;gap:4px;align-content:start;min-height:9.5em}
@media (min-width:900px){

.fade{animation:fadeUp .6s ease both}

 replay:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4V1L5.5 5 10 9V6a5 5 0 1 1-5 5H3a7 7 0 1 0 7-7z" fill="currentColor"/></svg>',
 sound:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7a4 4 0 0 1 0 6M15.5 4.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
 muted:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5l5 5M18 7.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'};
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

/* progress bar + chapter list */
const segs=scenes.map((s,i)=>{const b=document.createElement('button');b.className='seg';b.type='button';b.style.setProperty('--w',s.dur);
  b.setAttribute('aria-label','Go to chapter: '+s.short);b.innerHTML='<i></i>';b.onclick=()=>seek(i);bar.appendChild(b);return b.firstChild});
const chapBtns=scenes.map((s,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';
  b.innerHTML=`<span class="n">${fmt(s.start)}</span><span class="t">${s.short}${s.yr?`<small>${s.yr}</small>`:''}</span>`;
  b.onclick=()=>seek(i);li.appendChild(b);chapters.appendChild(li);return b});

/* ---------- audio: an uplifting track generated live, no files ---------- */
const C=(r,n)=>({r,n});
const D_=C(38,[62,66,69]),A_=C(45,[61,64,69]),Bm=C(47,[62,66,71]),G_=C(43,[62,67,71]);
const PROGS={anthem:[D_,A_,Bm,G_],climb:[G_,A_,Bm,D_],hope:[Bm,G_,D_,A_],finale:[G_,A_,D_,D_]};
const audio={ctx:null,muted:false,energy:1,prog:null,running:false,step:0,next:0,
 init(){
  if(this.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=this.ctx=new AC();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
  this.master=c.createGain();this.master.gain.value=.9;this.master.connect(comp);
  this.bus=c.createGain();this.bus.connect(this.master);
  this.music=c.createGain();this.music.connect(this.bus);
  this.drums=c.createGain();this.drums.connect(this.bus);
  const conv=c.createConvolver();const n=c.sampleRate*2.2,ir=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.5)}
  conv.buffer=ir;const rv=c.createGain();rv.gain.value=.25;this.music.connect(conv);conv.connect(rv);rv.connect(this.bus);
  const nb=this.nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=nb;src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.7;
  this.scr=c.createGain();this.scr.gain.value=0;src.connect(bp);bp.connect(this.scr);this.scr.connect(this.master);src.start();
  setInterval(()=>this.tick(),25);
 },
 f:m=>440*Math.pow(2,(m-69)/12),
 setScene(sc){
  if(!this.ctx)return;
  this.energy=sc.energy;this.prog=PROGS[sc.prog];
  if(!this.running){this.running=true;this.step=0;this.next=this.ctx.currentTime+.06}
 },
 pluck(t,fr,v,dec,type,cut,dest){const c=this.ctx,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type=type;o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=cut;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0008,t+dec);
  o.connect(lp);lp.connect(g);g.connect(dest||this.music);o.start(t);o.stop(t+dec+.05)},
 pad(t,ch,len,soft){const c=this.ctx;
  ch.n.forEach(m=>{const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=soft?900:2200;
   const lvl=soft?.05:.022,att=soft?.5:.03;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(lvl,t+att);g.gain.setValueAtTime(lvl,t+len-.05);g.gain.linearRampToValueAtTime(0,t+len+.3);
   lp.connect(g);g.connect(this.music);
   [-8,8].forEach(det=>{const o=c.createOscillator();o.type=soft?'sine':'sawtooth';o.frequency.value=this.f(m);o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+len+.35)})});
 },
 kick(t,v){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(this.drums);o.start(t);o.stop(t+.4)},
 noise(t,dur,type,freq,v){const c=this.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;
  fl.type=type;fl.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(this.drums);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)},
 tick(){
  if(!this.ctx||this.ctx.state!=='running'||!this.running||!this.prog)return;
  const sd=60/112/4,pat=[0,1,2,1,0,2,1,2];
  while(this.next<this.ctx.currentTime+.12){
   const t=this.next,s=this.step%16,ch=this.prog[Math.floor(this.step/16)%4],e=this.energy;
   if(s===0)this.pad(t,ch,sd*16,e===0);
   if(e===0){ if(s===0)this.kick(t,.32); if(s===3)this.kick(t,.2); }
   else{
    if(e>=2?s%4===0:(s===0||s===8))this.kick(t,.55);
    if(e>=2&&s%4===2)this.noise(t,.05,'highpass',7000,.08);
    if(e>=4&&s%2===1)this.noise(t,.03,'highpass',9500,.04);
    if(e>=3&&(s===4||s===12))this.noise(t,.17,'bandpass',1600,.22);
    if(e>=3&&s%2===0)this.pluck(t,this.f(s%4===2?ch.r+12:ch.r),.12,.22,'sawtooth',520,this.drums);
    if(s%(e>=4?1:2)===0)this.pluck(t,this.f(ch.n[pat[(s>>(e>=4?0:1))%8]]+12),e>=4?.035:.045,.35,'triangle',3400);
   }
   this.next+=sd;this.step++;
  }
 },
 scratch(level){if(!this.ctx)return;this.scr.gain.setTargetAtTime(level*(.45+.55*Math.random())*.03,this.ctx.currentTime,.03)},
 chime(){if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime;[[1,.06],[2.76,.022],[5.4,.01]].forEach(([r,v])=>this.pluck(t,this.f(81)*r,v,1.8,'sine',9000))},
 duck(on){if(this.ctx)this.bus.gain.setTargetAtTime(on?.42:1,this.ctx.currentTime,.12)},
 end(){if(!this.ctx||!this.running)return;this.running=false;const t=this.ctx.currentTime+.05;
  this.pad(t,D_,2.6,false);this.pluck(t,this.f(26),.18,2.5,'sine',300,this.drums);this.kick(t,.6);this.noise(t,2.2,'highpass',5000,.09)},
 pause(){this.ctx&&this.ctx.state==='running'&&this.ctx.suspend()},
 resume(){if(!this.ctx)return;if(this.ctx.state!=='running')this.ctx.resume();},
 setMute(m){this.muted=m;if(this.ctx)this.master.gain.setTargetAtTime(m?0:.9,this.ctx.currentTime,.05)}
};

/* ---------- voiceover: the browser's own speech voice ---------- */
const narr={ok:'speechSynthesis' in window,on:true,speaking:false,voice:null,
 list(){if(!this.ok)return[];return speechSynthesis.getVoices().filter(v=>/^(en|he)/i.test(v.lang))},
 rank(v){const n=v.name;const top=[/\bJenny\b/i,/\bAria\b/i,/\bAva\b.*(natural|online)/i,/\bMichelle\b/i,/\bEmma\b.*(natural|online)/i,/Samantha/i,/\bAva\b/i,/Allison/i,/Google US English/i,/\bZira\b/i];
  let r=top.findIndex(p=>p.test(n));if(r<0)r=50;if(/en-GB|UK|British|Daniel|Arthur|Oliver|George|Ryan|Thomas/i.test(n+v.lang))r+=100;if(/^he/i.test(v.lang))r+=60;if(/\b(male|Guy|Davis|Andrew|Brian|Christopher|Eric|Roger|Steffan|Aaron|Fred|Alex)\b/i.test(n))r+=80;return r},
 pick(){if(!this.ok)return;const vs=this.list();if(!vs.length)return;
  this.voice=vs.slice().sort((a,b)=>this.rank(a)-this.rank(b))[0]},
 speak(text){
  if(!this.ok||!this.on||audio.muted||!text)return;
  if(!this.voice)this.pick();
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  const parts=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const words=text.split(/\s+/).length;
  this.until=performance.now()+(words/2.3+2)*1000;   // safety: never wait longer than the line should take
  const token={};this.cur=token;
  parts.forEach((txt,k)=>{
   const u=new SpeechSynthesisUtterance(txt);if(this.voice){u.voice=this.voice;u.lang=this.voice.lang}else u.lang='en-US';
   u.rate=RM?.95:1.0;u.pitch=1.03;
   const done=()=>{if(this.cur===token){this.speaking=false;audio.duck(false)}};
   if(k===parts.length-1)u.onend=done;
   u.onerror=done;
   speechSynthesis.speak(u);
  });
  this.speaking=true;audio.duck(true);
 },
 busy(){if(this.speaking&&performance.now()>this.until){this.speaking=false;audio.duck(false)}return this.speaking},
 stop(){if(!this.ok)return;this.cur=null;speechSynthesis.cancel();this.speaking=false;audio.duck(false)},
 pause(){if(!this.ok)return;this.pausedAt=performance.now();speechSynthesis.pause()},
 resume(){if(!this.ok)return;if(this.pausedAt){this.until+=performance.now()-this.pausedAt;this.pausedAt=0}speechSynthesis.resume()}
};
if(narr.ok){narr.pick();speechSynthesis.onvoiceschanged=()=>narr.pick()}

/* ---------- scene building + rendering ---------- */
let cur=-1,built=null,t=0,playing=false,started=false,last=0,ended=false,holdT=0;
function build(i){
  const sc=scenes[i];gMain.innerHTML='';gAcc.innerHTML='';gLab.innerHTML='';
  const m=mk('path',{d:sc.main,class:'line'},gMain);const len=m.getTotalLength();m.style.strokeDasharray=len;
  const accs=(sc.acc||[]).map(a=>{const p=mk('path',{d:a.d,class:'acc'+(a.thin?' thin':'')},gAcc);const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;return {el:p,l,at:a.at,len:a.len||.8}});
  const labs=(sc.labels||[]).map(L=>{const tx=mk('text',{x:L.x,y:L.y,class:'lab'+(L.cls?' '+L.cls:''),'text-anchor':L.anchor||'start'},gLab);
    const lines=Array.isArray(L.t)?L.t:[L.t];lines.forEach((s,k)=>{const ts=mk('tspan',{x:L.x,dy:k?'1.05em':0},tx);ts.textContent=s});
    tx.style.opacity=0;return {el:tx,at:L.at,chime:L.chime,fired:false}});
  stage.style.backgroundColor=sc.bg;
  built={sc,m,len,accs,labs};
  // caption
  caption.innerHTML=`<span class="tag fade">${sc.tag}</span><h2 class="fade">${sc.title}</h2><p class="fade">${sc.body}</p>`+
    (sc.links?`<div class="links fade"><a href="https://lironsofer.online" target="_blank" rel="noopener">lironsofer.online</a><a href="https://www.linkedin.com/in/liron-sofer" target="_blank" rel="noopener">linkedin.com/in/liron-sofer</a></div>`:'');
  chapBtns.forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
}
const ease=x=>x<0?0:x>1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function render(lt,prevLt){
  const {sc,m,len,accs,labs}=built;
  const D=RM?.01:sc.draw,E=sc.erase,T=sc.dur,eraseAt=T-E;
  let off=0,fadeOut=1,drawing=0;
  if(lt<D){off=len*(1-ease(lt/D));drawing=1}
  else if(E&&lt>eraseAt){const p=RM?1:ease((lt-eraseAt)/E);off=-len*p;fadeOut=1-p;drawing=.5}
  m.style.strokeDashoffset=off;
  accs.forEach(a=>{const at=RM?Math.min(a.at,D):a.at;const p=RM?(lt>=at?1:0):ease((lt-at)/a.len);a.el.style.strokeDashoffset=a.l*(1-p);a.el.style.opacity=fadeOut;if(lt>at&&lt<at+a.len)drawing=Math.max(drawing,.6)});
  labs.forEach(L=>{const p=RM?(lt>=L.at?1:0):Math.min(1,Math.max(0,(lt-L.at)/.6));L.el.style.opacity=p*fadeOut;
    if(L.chime&&!L.fired&&prevLt!=null&&prevLt<L.at&&lt>=L.at&&playing){L.fired=true;audio.chime()}});
  if(playing)audio.scratch(drawing);else audio.scratch(0);
}
function sceneAt(time){for(let i=scenes.length-1;i>=0;i--)if(time>=scenes[i].start)return i;return 0}
function update(prevT){
  const i=sceneAt(Math.min(t,TOTAL-.0001));
  if(i!==cur){cur=i;build(i);holdT=0;if(started){audio.setScene(scenes[i]);if(playing)narr.speak(scenes[i].vo)}prevT=null}
  const lt=t-scenes[i].start;render(lt,prevT==null?null:prevT-scenes[i].start);
  segs.forEach((s,k)=>{const sc=scenes[k];s.style.width=Math.max(0,Math.min(1,(t-sc.start)/sc.dur))*100+'%'});
  timeEl.textContent=fmt(t)+' / '+fmt(TOTAL);
}
function setPlayIcon(){playBtn.innerHTML=ended?ICON.replay:playing?ICON.pause:ICON.play;playBtn.setAttribute('aria-label',ended?'Replay':playing?'Pause':'Play')}
let boil=0;
function frame(ts){
  const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
  if(playing){const prev=t;let nt=t+dt;
    const sc=scenes[cur],holdAt=sc.start+sc.dur-(sc.erase||0)-.3;
    if(narr.busy()&&nt>holdAt&&holdT<16){holdT+=dt;nt=Math.max(t,holdAt)}
    t=nt;
    if(t>=TOTAL){t=TOTAL;playing=false;ended=true;audio.end();audio.scratch(0);setPlayIcon()}
    update(prev);
    if(!RM&&(boil+=dt)>.12){boil=0;turb.setAttribute('seed',1+Math.floor(Math.random()*6))}
  }
  requestAnimationFrame(frame);
}
function start(){audio.init();audio.resume();started=true;overlay.hidden=true;t=0;cur=-1;ended=false;playing=true;update(null);setPlayIcon()}
function toggle(){
  if(!started)return start();
  if(ended){t=0;cur=-1;ended=false;playing=true;audio.resume();narr.resume();update(null);setPlayIcon();return}
  playing=!playing;if(playing){audio.resume();narr.resume()}else{audio.pause();narr.pause()}setPlayIcon();
}
function seek(i){
  if(!started){audio.init();started=true;overlay.hidden=true}
  narr.resume();t=scenes[i].start;cur=-1;ended=false;playing=true;audio.resume();update(null);setPlayIcon();
}
$('startBtn').onclick=e=>{e.stopPropagation();start()};overlay.onclick=start;
playBtn.onclick=toggle;
muteBtn.innerHTML=ICON.sound;
muteBtn.onclick=()=>{audio.setMute(!audio.muted);if(audio.muted)narr.stop();else if(playing)narr.speak(scenes[cur].vo);muteBtn.innerHTML=audio.muted?ICON.muted:ICON.sound;muteBtn.setAttribute('aria-label',audio.muted?'Unmute':'Mute')};
const voiceBtn=$('voiceBtn');
function setVoiceBtn(){voiceBtn.setAttribute('aria-pressed',narr.on&&narr.ok?'true':'false');voiceBtn.textContent=narr.ok?(narr.on?'Voice on':'Voice off'):'No voice';voiceBtn.disabled=!narr.ok}
voiceBtn.onclick=()=>{narr.on=!narr.on;if(!narr.on)narr.stop();else if(playing)narr.speak(scenes[cur].vo);setVoiceBtn()};setVoiceBtn();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});

/* resting frame: the opening scene fully drawn behind the play button */
build(0);cur=0;render(scenes[0].draw+2,null);
timeEl.textContent='0:00 / '+fmt(TOTAL);setPlayIcon();
requestAnimationFrame(frame);
})();
</script>
