function dayMap(d){
  var pts=[];
  d.items.forEach(function(it){var pl=placeOf(it);if(pl&&pl.lat!=null){pts.push(pl);}});
  if(pts.length<2) return '';
  var lats=pts.map(function(p){return p.lat;}), lons=pts.map(function(p){return p.lon;});
  var mnA=Math.min.apply(0,lats),mxA=Math.max.apply(0,lats),mnO=Math.min.apply(0,lons),mxO=Math.max.apply(0,lons);
  var W=320,H=190,pad=26, sx=(mxO-mnO)||0.01, sy=(mxA-mnA)||0.01;
  var k=Math.min((W-2*pad)/sx,(H-2*pad)/sy);
  var ox=(W-sx*k)/2, oy=(H-sy*k)/2;
  function X(p){return ox+(p.lon-mnO)*k;} function Y(p){return H-(oy+(p.lat-mnA)*k);}
  var line=pts.map(function(p){return X(p).toFixed(1)+','+Y(p).toFixed(1);}).join(' ');
  var dots=pts.map(function(p,i){return '<g><circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="11" fill="var(--lantern)" stroke="var(--surface)" stroke-width="2"/><text x="'+X(p).toFixed(1)+'" y="'+(Y(p)+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#1d1503" font-family="Assistant,sans-serif">'+(i+1)+'</text></g>';}).join('');
  var span=Math.max(sx*102,sy*111);
  var scale = span<1.5?'כ-'+Math.round(span*1000)+' מטר מקצה לקצה':'כ-'+Math.round(span)+' ק"מ מקצה לקצה';
  var q=pts.map(function(p){return p.q;});
  var url='https://www.google.com/maps/dir/?api=1&origin='+enc(q[0])+'&destination='+enc(q[q.length-1])+(q.length>2?'&waypoints='+q.slice(1,-1).map(enc).join('%7C'):'');
  return '<div class="panel map"><h3>המפה של היום</h3><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="מיקום העצירות של היום"><rect x="0" y="0" width="'+W+'" height="'+H+'" rx="10" fill="var(--sunk)"/><polyline points="'+line+'" fill="none" stroke="var(--jade)" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>'+dots+'<text x="'+(W-10)+'" y="'+(H-10)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Assistant,sans-serif">צפון ↑</text></svg><div class="note small">המספרים תואמים לפעילויות ברשימה. '+scale+'.</div><a class="btn primary" target="_blank" rel="noopener" href="'+url+'">כל העצירות בגוגל מפות</a></div>';
}

/* ---------- edit helpers ---------- */
function curItems(){return DATA.days[S.day].items;}
function findItem(id){var a=curItems();for(var i=0;i<a.length;i++) if(a[i].id===id) return i;return -1;}
function newId(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function markDirty(){ if(!S.dirty){S.dirty=true;S.saveMsg='';var eb=document.querySelector('.editbar');if(eb){eb.outerHTML=editbar();}else{app.insertAdjacentHTML('beforeend',editbar());}} }

app.addEventListener('input',function(e){
  var el=e.target, b=el.getAttribute('data-bind'); if(!b) return;
  if(b==='aiq'){S.ai.q=el.value;var l=document.getElementById('ai-link');if(l)l.href=claudeLink(el.value);return;}
  if(b==='hotel'){DATA.hotels[el.getAttribute('data-k')]=el.value;markDirty();return;}
  if(b==='dk'||b==='dv'){var id=el.getAttribute('data-id');DATA.docs.forEach(function(x){if(x.id===id){x[b==='dk'?'k':'v']=el.value;}});markDirty();return;}
  var i=findItem(el.getAttribute('data-id')); if(i<0) return;
  curItems()[i][b]=el.value; markDirty();
});

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='tab'){S.tab=el.getAttribute('data-tab');store.set('vt-tab',S.tab);render();window.scrollTo(0,0);return;}
  if(a==='day'){S.day=+el.getAttribute('data-i');store.set('vt-day',S.day);render();window.scrollTo(0,0);return;}
  if(a==='done'){var k=el.getAttribute('data-k');if(S.done[k])delete S.done[k];else S.done[k]=1;store.set('vt-done',S.done);render();return;}
  if(a==='driver'){var it=curItems()[findItem(id)];S.driver=placeOf(it);render();return;}
  if(a==='driverText'){var t=el.getAttribute('data-t');S.driver={n:'המלון',vn:t,q:''};render();return;}
  if(a==='closeDriver'){S.driver=null;render();return;}
  if(a==='copy'){var v=el.getAttribute('data-v');var ok=function(){el.textContent='הועתק';setTimeout(function(){el.textContent='העתקה';},1500);};
    try{navigator.clipboard.writeText(v).then(ok,function(){selectNear(el);});}catch(err){selectNear(el);} return;}
  if(a==='quick'){S.ai.q=el.getAttribute('data-q');if(sampleNs){ask();}else{render();}return;}
  if(a==='ask'){ask();return;}
  if(a==='toggleEdit'){S.edit=!S.edit;if(!S.edit&&!S.dirty)S.saveMsg='';render();return;}
  if(a==='add'){curItems().push({id:newId('x'),t:'',ti:'',de:''});markDirty();render();return;}
  if(a==='del'){var i=findItem(id);if(i>=0){curItems().splice(i,1);markDirty();render();}return;}
  if(a==='up'||a==='down'){var arr=curItems(),j=findItem(id),k2=a==='up'?j-1:j+1;if(j>=0&&k2>=0&&k2<arr.length){var tmp=arr[j];arr[j]=arr[k2];arr[k2]=tmp;markDirty();render();}return;}
  if(a==='dadd'){DATA.docs.push({id:newId('d'),k:'',v:''});markDirty();render();return;}
  if(a==='ddel'){DATA.docs=DATA.docs.filter(function(x){return x.id!==id;});markDirty();render();return;}
  if(a==='save'){save();return;}
  if(a==='wxRefresh'){ensureWx(true);return;}
  if(a==='pinOk'){var pv=(document.getElementById('pin-input')||{}).value||'';pv=pv.trim();if(pv){LIVE.pin=pv;store.set('vt-pin',pv);S.saveMsg='';render();}return;}
});
function selectNear(el){var v=el.parentNode.querySelector('.v');if(!v)return;var r=document.createRange();r.selectNodeContents(v);var s=getSelection();s.removeAllRanges();s.addRange(r);}

/* ---------- AI ---------- */
var aiCtrl=null;
function ask(){
  var q=(S.ai.q||'').trim(); if(!q||!sampleNs||S.ai.busy) return;
  if(aiCtrl) aiCtrl.abort(); aiCtrl=new AbortController();
  S.ai.busy=true;S.ai.ans='';S.ai.err='';render();
  sampleNs(buildPrompt(q),{signal:aiCtrl.signal,cache:false,onText:function(p){S.ai.ans=p.text;var box=document.querySelector('.answer');if(box){box.textContent=p.text;}else if(S.tab==='ai'){render();}}})
  .then(function(r){S.ai.ans=r.text;S.ai.busy=false;render();})
  .catch(function(err){S.ai.busy=false;var c=err&&err.code;
    if(c==='not_granted'){sampleNs=null;S.ai.err='העוזר לא קיבל אישור בתצוגה הזו. אפשר לשאול דרך אפליקציית Claude.';}
    else if(c==='rate_limited'){S.ai.err='יותר מדי שאלות ברצף. נסו שוב בעוד דקה.';}
    else if(err&&err.name==='AbortError'){S.ai.err='';}
    else {S.ai.err='לא הצלחתי לקבל תשובה. בדקו את החיבור לאינטרנט ונסו שוב.';}
    if(err&&err.text) S.ai.ans=err.text; render();});
}

/* ---------- save (republish page with new data) ---------- */
function buildDoc(){
  var style=document.getElementById('app-style').textContent;
  var script=document.getElementById('app-script').textContent;
  var json=JSON.stringify(DATA).replace(/</g,'\\u003c');
  var SC='scr'+'ipt';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>וייטנאם 2026</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style id="app-style">'+style+'</style>\n<div id="app"></div>\n'+
    '<'+SC+' id="trip-data" type="application/json">'+json+'</'+SC+'>\n'+
    '<'+SC+' id="app-script">'+script+'</'+SC+'>\n</body></html>';
}
function save(){
  if(S.saving) return;
  DATA.updated=new Date().toISOString();
  if(LIVE.on) return saveWorker();
  if(!artifactNs) return;
  S.saving=true;render();
  artifactNs.publish(buildDoc()).then(function(){S.saving=false;S.dirty=false;S.saveMsg='נשמר';render();clearMsgSoon();})
  .catch(function(err){S.saving=false;var c=err&&err.code;
    S.saveMsg = c==='conflict'?'מישהו אחר שמר שינוי באותו רגע. הדף נטען מחדש עם הגרסה שלו.': (c==='not_granted'||c==='not_writer')?'אין לכם הרשאה לשמור שינויים בדף הזה.':'השמירה לא הצליחה. נסו שוב.';
    if(c==='not_granted'||c==='not_writer'){S.canEdit=false;S.edit=false;S.dirty=false;}
    render();});
}
function clearMsgSoon(){setTimeout(function(){if(!S.dirty){S.saveMsg='';render();}},4000);}
function saveWorker(){
  if(!LIVE.pin){S.edit=true;S.saveMsg='הזינו את קוד העריכה ואז לחצו שמירה.';render();return;}
  S.saving=true;render();
  fetch(window.__aiEndpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tripSave:{id:TRIP_ID,key:LIVE.pin,rev:LIVE.rev,data:DATA}})})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,j:j};});})
  .then(function(x){
    S.saving=false;
    if(x.ok){LIVE.rev=x.j.rev||LIVE.rev+1;S.dirty=false;S.saveMsg='נשמר לכולם';store.set('vt-live',{rev:LIVE.rev,data:DATA});clearMsgSoon();}
    else if(x.j.code==='bad_key'){LIVE.pin='';store.set('vt-pin','');S.saveMsg='הקוד לא נכון. הזינו אותו שוב.';}
    else if(x.status===409){S.dirty=false;S.edit=false;S.saveMsg='מישהו אחר שמר שינוי בינתיים, אז הגרסה שלו נטענה. אפשר לערוך שוב.';loadLive(true);}
    else S.saveMsg='השמירה לא הצליחה. נסו שוב בעוד רגע.';
    render();
  },function(){S.saving=false;S.saveMsg='אין חיבור לאינטרנט. השינויים עדיין כאן, שמרו שוב כשיהיה חיבור.';render();});
}
function loadLive(force){
  var ep=window.__aiEndpoint; if(!ON_SITE||!ep) return;
  try{
    fetch(ep+'?trip='+TRIP_ID,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j) return;
      LIVE.on=true; S.canEdit=true;
      if(S.dirty){render();return;}
      if(j.data&&j.data.days&&(force||(j.data.updated||'')>=(DATA.updated||''))){DATA=j.data;if(S.day>=DATA.days.length)S.day=0;store.set('vt-live',{rev:j.rev||0,data:DATA});}
      LIVE.rev=j.rev||0;
      render();
    },function(){});
  }catch(e){}
}

/* ---------- boot ---------- */
render();
setInterval(function(){var c=document.querySelector('.clocks');if(c)c.outerHTML=clocks();ensureWx(false);},60000);
if(ON_SITE){
  loadLive(false);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(!S.dirty)loadLive(false);ensureWx(false);}});
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
}
if(window.claude&&window.claude.use){
  window.claude.use('sample').then(function(s){sampleNs=s;sampleReady=true;if(S.tab==='ai'&&!S.ai.busy)render();},function(){sampleReady=true;if(S.tab==='ai')render();});
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    artifactNs=r[0]; var u=r[1];
    var can = artifactNs && u && typeof u.canEdit==='function' ? u.canEdit() : false;
    Promise.resolve(can).then(function(v){ if(v){S.canEdit=true;render();} });
  },function(){});
} else { sampleReady=true; }
})();
</script>
